<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Roadmap</title>
    <link rel="stylesheet" href="frame-styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.0.0/dist/vis-network.min.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-y: auto;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 10px,
                    rgba(255,255,255,.05) 10px,
                    rgba(255,255,255,.05) 20px
                );
            pointer-events: none;
            z-index: 0;
        }
        h1 {
            text-align: center;
            color: #1abc9c;
            margin: 20px 0 10px;
            font-size: 36px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }
        p {
            text-align: center;
            margin: 5px 0;
            position: relative;
            z-index: 1;
        }
        #roadmap {
            width: 95%;
            max-width: 1400px;
            margin: 20px auto;
            height: 800px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 50px;
            position: relative;
            z-index: 1;
            border: 3px solid #e0e0e0;
        }
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            background-color: white;
            padding: 30px;
            border: 3px solid #1abc9c;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(220, 53, 69, 0.3);
            z-index: 2000;
            max-width: 400px;
            max-height: 85vh;
            overflow: auto;
            width: 350px;
        }
        .modal h2 {
            margin-top: 0;
            color: #1abc9c;
            border-bottom: 2px solid #1abc9c;
            padding-bottom: 10px;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 28px;
            color: #1abc9c;
            font-weight: bold;
            transition: color 0.3s;
        }
        .modal-close:hover {
            color: #16a085;
        }
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .modal {
                top: 50%;
                right: 10px;
                transform: translateY(-50%);
                width: calc(100vw - 20px);
                max-width: none;
                max-height: 70vh;
            }
            
            #progress-container {
                top: 250px;
                right: 10px;
                width: 40px;
                height: 40px;
                padding: 0;
            }
            
            #progress-text {
                font-size: 11px;
            }
            
            #level-container {
                top: 305px;
                right: 10px;
                width: 40px;
                height: 40px;
                padding: 0;
            }
            
            #level-badge {
                width: 40px;
                height: 40px;
                font-size: 24px;
            }
            
            #xp-text {
                font-size: 10px;
            }
        }
        #logo {
            width: 200px;      
            height: auto;     
            transition: 0.3s; 
        }
        #logo:hover {
            width: 300px;
        }
        /* Menu button */
        #menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3);
            transition: all 0.3s;
        }
        #menu-btn:hover {
            background: linear-gradient(135deg, #16a085 0%, #a01810 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(220, 53, 69, 0.4);
        }
        #menu-btn span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 3px 0;
            border-radius: 2px;
        }
        /* Menu dropdown */
        #menu-dropdown {
            display: none;
            position: fixed;
            top: 65px;
            left: 15px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            min-width: 250px;
            max-height: 400px;
            overflow-y: auto;
        }
        #menu-dropdown a, #menu-dropdown .menu-section {
            display: block;
            padding: 12px 20px;
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }
        #menu-dropdown a:hover {
            background-color: #fff5f5;
            color: #1abc9c;
        }
        .menu-section {
            background-color: #f9f9f9;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            cursor: default;
        }
        .menu-section:hover {
            background-color: #f9f9f9;
            color: #666;
        }
        #module-input-container {
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        #module-input-container input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
            margin-bottom: 8px;
        }
        #module-input-container button {
            width: 100%;
            padding: 8px;
            background-color: #1abc9c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        #module-input-container button:hover {
            background-color: #16a085;
        }
        /* User info */
        #user-info {
            position: fixed;
            top: 70px;
            left: 15px;
            background: linear-gradient(135deg, white 0%, #fff5f5 100%);
            padding: 10px 18px;
            border-radius: 20px;
            box-shadow: 0 3px 10px rgba(26, 188, 156, 0.15);
            font-size: 13px;
            color: #1abc9c;
            z-index: 999;
            border: 2px solid #c8f7f0;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #profile-pic-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #1abc9c;
            object-fit: cover;
            display: none;
        }
        #profile-pic-avatar.show {
            display: block;
        }
        .course-info {
            text-align: center;
            font-size: 15px;
            color: #555;
            margin: 8px 0;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }
        /* Progress Bar - Collapsible Icon */
        #progress-container {
            position: fixed;
            top: 250px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: white;
            padding: 0;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(26, 188, 156, 0.2);
            z-index: 999;
            border: 2px solid #c8f7f0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        #progress-container:hover {
            width: 250px;
            border-radius: 10px;
            height: auto;
            padding: 15px;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
        }
        #progress-container:hover .progress-icon {
            display: none;
        }
        #progress-container:hover .progress-content {
            display: block;
        }
        .progress-icon {
            display: block;
        }
        .progress-content {
            display: none;
            width: 100%;
        }
        .progress-content .progress-title {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
        }
        #progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }
        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1abc9c 0%, #16a085 100%);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 10px;
        }
        #progress-text {
            font-size: 12px;
            color: #1abc9c;
            font-weight: 600;
            text-align: center;
            margin-top: 8px;
        }
        
        /* Level/XP Display - Collapsible Icon */
        #level-container {
            position: fixed;
            top: 305px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #fff8f0 0%, #fff0e8 100%);
            padding: 0;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(26, 188, 156, 0.2);
            z-index: 999;
            border: 2px solid #ffd9b3;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        #level-container:hover {
            width: 250px;
            border-radius: 10px;
            height: auto;
            padding: 15px;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
        }
        #level-container:hover .level-icon {
            display: none;
        }
        #level-container:hover .level-content {
            display: block;
        }
        .level-icon {
            display: block;
        }
        .level-content {
            display: none;
            width: 100%;
        }
        #level-display {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: #d97845;
        }
        #level-badge {
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ffa500 0%, #ff8c00 100%);
            border-radius: 50%;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.3);
        }
        #level-info {
            flex: 1;
        }
        #level-number {
            font-size: 16px;
            color: #d97845;
        }
        #xp-bar {
            width: 100%;
            height: 6px;
            background: #f0e0d0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 6px;
        }
        #xp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffa500 0%, #ff8c00 100%);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 10px;
        }
        #xp-text {
            font-size: 11px;
            color: #d97845;
            font-weight: 600;
            text-align: center;
            margin-top: 4px;
        }
        
        /* Node Hover Animation */
        .vis-network canvas {
            transition: all 0.2s ease;
        }
        .node-hover-glow {
            filter: drop-shadow(0 0 15px rgba(26, 188, 156, 0.6));
            transform: scale(1.1);
        }
        
        /* Canvas node fade-in animation */
        #roadmap {
            animation: containerFadeIn 0.5s ease-in;
        }
        @keyframes containerFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes levelUpPop {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
        @keyframes fadeOut {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Menu Button -->
    <button id="menu-btn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>
    
    <!-- Menu Dropdown -->
    <div id="menu-dropdown">
        <div class="menu-section">📚 Manage Modules</div>
        <div id="module-input-container">
            <input 
                type="text" 
                id="new-module-input" 
                placeholder="Add new module..." 
                onkeypress="if(event.key==='Enter') addModuleToRoadmap()"
            >
            <button onclick="addModuleToRoadmap()">Add Module</button>
        </div>
        
        <div class="menu-section">⚙️ Navigation</div>        <a href="#" id="my-roads-btn" style="display: none;" onclick="openMyRoadmaps(); return false;">🗺️ My Roadmaps</a>
        <a href="#" onclick="openAchievements(); return false;">🏆 Achievements</a>
        <a href="progress.html">📊 Your Progress</a>
        <a href="index.html">🏠 Home</a>
        <a href="login.html">🔑 Login</a>
        <a href="signup.html">📝 Sign Up</a>
        <a href="#" onclick="logout(); return false;">🚪 Logout</a>
    </div>

    <!-- User Info -->
    <div id="user-info">
        <img id="profile-pic-avatar" alt="Profile">
        <span id="username">Guest</span>
        <a href="profile.html" style="margin-left: 15px; padding: 8px 15px; background-color: #1abc9c; color: white; text-decoration: none; border-radius: 5px; font-weight: 600; transition: all 0.3s;" onmouseover="this.style.backgroundColor='#16a085'" onmouseout="this.style.backgroundColor='#1abc9c'">⚙️ Profile</a>
    </div>

    <!-- Progress Container -->
    <div id="progress-container">
        <div class="progress-icon">📈</div>
        <div class="progress-content">
            <div class="progress-title">📈 Progress</div>
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div id="progress-text">0/7 Modules</div>
        </div>
    </div>
    
    <!-- Level/XP Container -->
    <div id="level-container">
        <div class="level-icon">⭐</div>
        <div class="level-content">
            <div id="level-display">
                <div id="level-badge">⭐</div>
                <div id="level-info">
                    <div id="level-number">Level 1</div>
                    <div id="xp-bar">
                        <div id="xp-fill"></div>
                    </div>
                    <div id="xp-text">0 / 200 XP</div>
                </div>
            </div>
        </div>
    </div>

    <h1>Student Roadmap</h1>
    <p class="course-info" id="university-display"></p>
    <p id="input-display"></p>
    <img id="logo" src="assets\Gemini_Generated_Image_9eplpw9eplpw9epl__1_-removebg-preview.png" alt="Logo" style="position: fixed; top: 5px; right: 5px; cursor: default; z-index: 10;">
    <div id="roadmap"></div>

    <div id="node-modal" class="modal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <h2 id="modal-title"></h2>
        <p id="modal-content"></p>
        <button id="quiz-button" style="margin-top: 15px; padding: 10px 20px; background-color: #1abc9c; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600;" onclick="openQuiz()">📝 Take Quiz</button>
        <p id="quiz-score" style="margin-top: 10px; font-size: 14px; color: #666; display: none;"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.0.0/dist/vis-network.min.js"></script>
    <script>
        // XP and Leveling System - Define early to avoid ReferenceError
        const levelThresholds = [
            0,    // Level 1
            200,  // Level 2
            500,  // Level 3
            900,  // Level 4
            1400, // Level 5
            2000, // Level 6
            2700, // Level 7
            3500, // Level 8
            4400, // Level 9
            5400  // Level 10
        ];
        
        // Get input from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const input = urlParams.get('input');
        const courseName = urlParams.get('course');
        const universityName = urlParams.get('university');
        
        // Display course and university info
        const firstNode = input ? input.split(',')[0].trim() : null;
        document.getElementById('input-display').textContent = firstNode ? `Tailored Roadmap for: ${courseName || firstNode}` : 'Sample roadmap (no input provided)';
        
        if (universityName) {
            const universityDisplayMap = {
                'ucl': 'University College London',
                'imperial': 'Imperial College London',
                'oxford': 'University of Oxford',
                'cambridge': 'University of Cambridge',
                'edinburgh': 'University of Edinburgh',
                'manchester': 'University of Manchester',
                'kcl': "King's College London"
            };
            document.getElementById('university-display').textContent = `📚 ${universityDisplayMap[universityName] || universityName}`;
        }
        
        // Check login status
        function checkLoginStatus() {
            const user = localStorage.getItem('currentUser');
            const profilePic = document.getElementById('profile-pic-avatar');
            
            if (user) {
                const userData = JSON.parse(user);
                document.getElementById('username').textContent = userData.name || userData.email;
                
                // Load and display profile picture if available
                const profilePictureData = localStorage.getItem('profilePictureData');
                if (profilePictureData) {
                    profilePic.src = profilePictureData;
                    profilePic.classList.add('show');
                    
                    // Apply selected frame
                    applyProfileFrame(profilePic);
                } else {
                    profilePic.classList.remove('show');
                }
                
                // Show My Roadmaps button for logged-in users
                const myRoadsBtn = document.getElementById('my-roads-btn');
                if (myRoadsBtn) myRoadsBtn.style.display = 'block';
                
                // Initialize achievements and level system for this user
                initAchievements();
                initUserLevel();
            } else {
                document.getElementById('username').textContent = 'Guest';
                profilePic.classList.remove('show');
            }
        }
        
        // Apply selected frame to profile picture
        function applyProfileFrame(profilePic) {
            const selectedFrame = localStorage.getItem('selectedProfileFrame') || 'none';
            
            // Remove all frame classes
            profilePic.classList.remove('profile-pic-none', 'profile-pic-basic', 'profile-pic-intermediary', 'profile-pic-master');
            
            // Add the selected frame class
            if (selectedFrame !== 'none') {
                profilePic.classList.add('profile-pic-' + selectedFrame);
            } else {
                profilePic.classList.add('profile-pic-none');
            }
        }
        
        // Save roadmap state to localStorage
        function saveRoadmapState() {
            if (!window.network || !window.nodes) return;
            
            const state = {
                nodes: window.nodes.get(),
                edges: window.edges.get(),
                viewportState: {
                    scale: window.network.getScale(),
                    position: window.network.getViewPosition()
                },
                inputModules: document.getElementById('input-display')?.textContent || ''
            };
            
            localStorage.setItem('roadmapState', JSON.stringify(state));
        }
        
        // Restore roadmap state from localStorage
        function restoreRoadmapState() {
            const savedState = localStorage.getItem('roadmapState');
            if (savedState) {
                try {
                    const state = JSON.parse(savedState);
                    // State will be restored after network initialization
                    return state;
                } catch (e) {
                    console.error('Error restoring roadmap state:', e);
                }
            }
            return null;
        }
        
        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('currentUser');
                // Hide My Roadmaps button
                const myRoadsBtn = document.getElementById('my-roads-btn');
                if (myRoadsBtn) myRoadsBtn.style.display = 'none';
                alert('Logged out successfully!');
                checkLoginStatus();
            }
        }
        
        // Open My Roadmaps modal
        function openMyRoadmaps() {
            const user = localStorage.getItem('currentUser');
            if (!user) {
                alert('Please login to view your roadmaps');
                return;
            }
            
            // Fetch user roadmaps from localStorage (or backend when available)
            const userRoadmaps = JSON.parse(localStorage.getItem('userRoadmaps')) || [];
            
            let html = '<h2>🗺️ My Roadmaps</h2>';
            
            if (userRoadmaps.length === 0) {
                html += '<p style="color: #666; text-align: center; padding: 20px;">No saved roadmaps yet. Create one and save it!</p>';
            } else {
                html += '<div style="display: flex; flex-direction: column; gap: 10px;">';
                userRoadmaps.forEach((roadmap, index) => {
                    html += `
                        <div style="padding: 12px; background-color: #f5f5f5; border-radius: 8px; cursor: pointer; border-left: 4px solid #1abc9c;" onmouseover="this.style.backgroundColor='#efefef'" onmouseout="this.style.backgroundColor='#f5f5f5'" onclick="loadRoadmapSnapshot(${index})">
                            <strong>${roadmap.name || 'Unnamed Roadmap'}</strong><br>
                            <small style="color: #999;">${roadmap.createdAt || 'No date'}</small>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            // Show in modal
            const modal = document.querySelector('.modal');
            if (modal) {
                modal.innerHTML = html + '<button onclick="closeModal()" style="width: 100%; margin-top: 15px; padding: 10px; background: #1abc9c; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Close</button>';
                modal.style.display = 'block';
            }
        }
        
        // Load a saved roadmap snapshot
        function loadRoadmapSnapshot(index) {
            const userRoadmaps = JSON.parse(localStorage.getItem('userRoadmaps')) || [];
            if (userRoadmaps[index]) {
                const roadmap = userRoadmaps[index];
                localStorage.setItem('roadmapState', JSON.stringify(roadmap.state));
                location.reload();
            }
        }
        
        // Initialize login status
        checkLoginStatus();
        
        // Dynamic spacing for progress and level icons
        const progressContainer = document.getElementById('progress-container');
        const levelContainer = document.getElementById('level-container');
        
        // Initial positions
        const progressInitialTop = 250;
        const levelInitialTop = 305;
        
        progressContainer.addEventListener('mouseenter', function() {
            // Move level container down when progress expands
            levelContainer.style.transition = 'top 0.3s ease';
            levelContainer.style.top = (levelInitialTop + 50) + 'px'; // Move down by 50px when progress expands
        });
        
        progressContainer.addEventListener('mouseleave', function() {
            // Move level container back
            levelContainer.style.top = levelInitialTop + 'px';
        });
        
        // Draggable logo
        const logo = document.getElementById('logo');
        let isDragging = false;
        let offsetX, offsetY;

        // Sample data for the roadmap
        const sampleNodes = [
            { id: 1, label: 'Introduction to Programming' },
            { id: 2, label: 'Variables and Data Types' },
            { id: 3, label: 'Control Structures' },
            { id: 4, label: 'Functions' },
            { id: 5, label: 'Object-Oriented Programming' },
            { id: 6, label: 'Data Structures' },
            { id: 7, label: 'Algorithms' }
        ];
        const sampleEdges = [
            { from: 1, to: 2 },
            { from: 2, to: 3 },
            { from: 3, to: 4 },
            { from: 4, to: 5 },
            { from: 5, to: 6 },
            { from: 6, to: 7 }
        ];

        // Fallback visualization if Vis.js doesn't load
        function createFallbackVisualization(container, nodesData, edgesData) {
            console.log('Creating fallback visualization');
            container.innerHTML = '';
            
            // Create a flow layout with the nodes

            // Check if Vis.Network is available

        // Add new module to the roadmap
        function addModuleToRoadmap() {
            // Check if network and nodes exist
            if (!window.network || !window.nodes || !window.edges) {
                alert('Please wait for the roadmap to load');
                return;
            }
            
            const input = document.getElementById('new-module-input');
            const moduleName = input.value.trim();
            
            if (!moduleName) {
                alert('Please enter a module name');
                return;
            }
            
            // Get all current nodes
            const currentNodes = window.nodes.get();
            const nodeIds = currentNodes.map(n => n.id);
            const maxId = nodeIds.length > 0 ? Math.max(...nodeIds) : 0;
            const newId = maxId + 1;
            
            // Add new node to the network
            const newNode = {
                id: newId,
                label: moduleName
            };
            window.nodes.add([newNode]);
            
            // Also update window.nodesData for quiz functionality
            if (!window.nodesData) window.nodesData = [];
            window.nodesData.push(newNode);
            
            // Connect the new module to the last module in the sequence
            if (nodeIds.length > 0) {
                const lastNodeId = nodeIds[nodeIds.length - 1];
                window.edges.add([{
                    from: lastNodeId,
                    to: newId
                }]);
            }
            
            // Clear input field
            input.value = '';
            
            // Trigger network animation to fit the new node
            if (window.network.fit) {
                window.network.fit({
                    animation: {
                        duration: 400,
                        easingFunction: 'easeInOutQuad'
                    }
                });
            }

        function addXP(amount) {
            const user = localStorage.getItem('currentUser');
            if (!user) return;
            
            const userData = JSON.parse(user);
            const userXPKey = `user-xp-${userData.email}`;
            const userLevelKey = `user-level-${userData.email}`;

            currentXP += amount;
            
            // Check for level ups
            while (currentLevel < levelThresholds.length && currentXP >= levelThresholds[currentLevel]) {
                currentLevel++;

            localStorage.setItem(userLevelKey, currentLevel);
            
            updateLevelDisplay();
            checkAchievements();
        }

        function calculateQuizXP(score) {
            let xp = 100; // Base XP
            
            if (score >= 50) {
                // Bonus XP: 20 XP per 10% above 50%
                const bonusPercent = Math.floor((score - 50) / 10);
                xp += bonusPercent * 20;
            }
            
            return Math.min(xp, 200); // Max 200 XP per quiz
        }

        function updateLevelDisplay() {
            const user = localStorage.getItem('currentUser');
            if (!user) return;
            
            const userData = JSON.parse(user);
            const userLevelKey = `user-level-${userData.email}`;
            const userXPKey = `user-xp-${userData.email}`;
            
            const currentLevel = parseInt(localStorage.getItem(userLevelKey)) || 1;
            const currentXP = parseInt(localStorage.getItem(userXPKey)) || 0;
            
            const levelNumber = document.getElementById('level-number');
            const xpBar = document.getElementById('xp-fill');
            const xpText = document.getElementById('xp-text');
            
            if (currentLevel >= levelThresholds.length) {
                // Max level reached
                if (levelNumber) levelNumber.textContent = `Level ${currentLevel} (MAX)`;
                if (xpBar) xpBar.style.width = '100%';
                if (xpText) xpText.textContent = `${currentXP} XP (Max Level)`;
                return;
            }
            
            const currentLevelXP = levelThresholds[currentLevel - 1];
            const nextLevelXP = levelThresholds[currentLevel];
            const xpInCurrentLevel = currentXP - currentLevelXP;
            const xpNeededForLevel = nextLevelXP - currentLevelXP;
            const progressPercent = (xpInCurrentLevel / xpNeededForLevel) * 100;
            
            if (levelNumber) levelNumber.textContent = `Level ${currentLevel}`;
            if (xpBar) xpBar.style.width = Math.min(progressPercent, 100) + '%';
            if (xpText) xpText.textContent = `${xpInCurrentLevel} / ${xpNeededForLevel} XP`;
        }

                    createNetwork(sampleNodes, sampleEdges);
                } catch (e2) {
                    console.error('Failed to create network:', e2);
                    // Last resort - create the container manually
                    const container = document.getElementById('roadmap');
                    if (container) {
                        console.log('Creating fallback visualization directly...');
                        createFallbackVisualization(container, sampleNodes, sampleEdges);
                    }
                }
            }
        }
        
        // Initialize on DOMContentLoaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                console.log('[DEBUG] DOMContentLoaded event fired');
                setTimeout(initializeRoadmap, 50);
            });
        } else {
            console.log('[DEBUG] DOM already loaded, initializing...');
            setTimeout(initializeRoadmap, 50);
        }
        
        console.log('[DEBUG] Roadmap script loaded, waiting for initialization...');
    
    // Save roadmap state before leaving page
        window.addEventListener('beforeunload', saveRoadmapState);
        window.addEventListener('pagehide', saveRoadmapState);    </script>
</body>
</html>

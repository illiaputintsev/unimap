<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Roadmap</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            min-height: 100vh;
            overflow-y: auto;
        }
        h1 {
            text-align: center;
            color: #2196F3; /* Blue to match theme */
            margin: 10px 0;
        }
        p {
            text-align: center;
            margin: 5px 0;
        }
        #roadmap {
            width: 100%;
            height: 800px; /* Initial height, will be adjusted dynamically */
            background-color: white;
            margin-top: 10px;
            margin-bottom: 50px; /* Add space at bottom */
        }
        .modal {
            display: none;
            position: fixed;
            top: 30%;
            left: 5%;
            transform: translateY(-50%);
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 1000;
            max-width: 90vw;
            max-height: 80vh;
            overflow: auto;
            width: 400px;
        }
        .modal h2 {
            margin-top: 0;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            font-size: 20px;
        }
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .modal {
                top: 10%;
                left: 5%;
                transform: none;
                width: 90vw;
                max-width: none;
                max-height: 70vh;
            }
        }
        #logo {
            width: 200px;      
            height: auto;     
            transition: 0.3s; 
        }
        #logo:hover {
            width: 300px;
        }
        /* Menu button */
        #menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 40px;
            height: 40px;
            background-color: #2196F3;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
        }
        #menu-btn:hover {
            background-color: #1976D2;
        }
        #menu-btn span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 3px 0;
            border-radius: 2px;
        }
        /* Menu dropdown */
        #menu-dropdown {
            display: none;
            position: fixed;
            top: 65px;
            left: 15px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            min-width: 180px;
        }
        #menu-dropdown a {
            display: block;
            padding: 12px 20px;
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }
        #menu-dropdown a:last-child {
            border-bottom: none;
        }
        #menu-dropdown a:hover {
            background-color: #f5f5f5;
            color: #2196F3;
        }
    </style>
</head>
<body>
    <!-- Menu Button -->
    <button id="menu-btn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>
    
    <!-- Menu Dropdown -->
    <div id="menu-dropdown">
        <a href="index.html">🏠 Return to Home</a>
    </div>

    <h1>Student Roadmap</h1>
    <p id="input-display"></p>
    <img id="logo" src="assets\Gemini_Generated_Image_9eplpw9eplpw9epl__1_-removebg-preview.png" alt="Logo" style="position: fixed; top: 5px; right: 5px; cursor: default; z-index: 10;">
    <div id="roadmap"></div>

    <div id="node-modal" class="modal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <h2 id="modal-title"></h2>
        <p id="modal-content"></p>
    </div>

    <script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
    <script>
        // Get input from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const input = urlParams.get('input');
        // Display only the first node (main course name)
        const firstNode = input ? input.split(',')[0].trim() : null;
        document.getElementById('input-display').textContent = firstNode ? `Tailored Roadmap for: ${firstNode}` : 'Sample roadmap (no input provided)';
        // Draggable logo
        const logo = document.getElementById('logo');
        let isDragging = false;
        let offsetX, offsetY;

        // Sample data for the roadmap
        const sampleNodes = [
            { id: 1, label: 'Introduction to Programming' },
            { id: 2, label: 'Variables and Data Types' },
            { id: 3, label: 'Control Structures' },
            { id: 4, label: 'Functions' },
            { id: 5, label: 'Object-Oriented Programming' },
            { id: 6, label: 'Data Structures' },
            { id: 7, label: 'Algorithms' }
        ];
        const sampleEdges = [
            { from: 1, to: 2 },
            { from: 2, to: 3 },
            { from: 3, to: 4 },
            { from: 4, to: 5 },
            { from: 5, to: 6 },
            { from: 6, to: 7 }
        ];

        // Function to create the network
        function createNetwork(nodesData, edgesData) {
            const container = document.getElementById('roadmap');
            const data = { 
                nodes: new vis.DataSet(nodesData), 
                edges: new vis.DataSet(edgesData) 
            };

            const options = {
                autoResize: true,
                layout: {
                    hierarchical: {
                        direction: 'UD',
                        sortMethod: 'directed',
                        nodeSpacing: 150,
                        levelSeparation: 100 // Controls vertical gap between nodes
                    }
                },
                physics: false,
                interaction: {
                    dragNodes: false,
                    dragView: false,
                    zoomView: false // Disable zoom to allow page scroll with mouse wheel
                },
                nodes: {
                    color: '#2196F3',
                    shape: 'box',
                    margin: 10,
                    font: { size: 16, color: 'white' }
                },
                edges: {
                    arrows: { to: { enabled: false } }, // Removes the arrows
                    color: '#495057',
                    width: 2
                }
            };

            const network = new vis.Network(container, data, options);

            // Prevent canvas from capturing scroll wheel - allow page scroll
            container.addEventListener('wheel', (e) => {
                // Let the event bubble up to allow page scrolling
                return true;
            }, { passive: true });

            // Calculate and set container height based on number of nodes
            const nodeCount = nodesData.length;
            const levelSeparation = 100;
            const estimatedHeight = Math.max(800, (nodeCount * levelSeparation) + 400);
            container.style.height = estimatedHeight + 'px';

            // Show all nodes and position properly
            network.once('stabilized', function() {
                // Fit all nodes in view
                network.fit({ animation: false });
                // Scroll page to top
                window.scrollTo(0, 0);
            });

            // POPUP LOGIC: Re-adding the click event
            network.on('click', function(params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const node = nodesData.find(n => n.id === nodeId);
                    if (node) {
                        document.getElementById('modal-title').textContent = node.label;
                        document.getElementById('modal-content').textContent = `Step ${node.id}: Detailed resources for learning ${node.label} will appear here`;
                        document.getElementById('node-modal').style.display = 'block';
                    }
                }
            });
        }

        function closeModal() {
            document.getElementById('node-modal').style.display = 'none';
        }

        function toggleMenu() {
            const menu = document.getElementById('menu-dropdown');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        // Close menu when clicking outside
        window.addEventListener('click', function(e) {
            const menu = document.getElementById('menu-dropdown');
            const menuBtn = document.getElementById('menu-btn');
            if (!menuBtn.contains(e.target) && !menu.contains(e.target)) {
                menu.style.display = 'none';
            }
        });

        if (input) {
            const moduleNames = input.split(',').map(name => name.trim()).filter(name => name);
    
            // Create Nodes
            const nodesData = moduleNames.map((name, index) => ({ 
                id: index + 1, 
                label: name 
            }));

            // Create a Chain (1 -> 2 -> 3 -> 4...)
            const edgesData = [];
            for (let i = 0; i < nodesData.length - 1; i++) {
                edgesData.push({ 
                    from: nodesData[i].id, 
                    to: nodesData[i+1].id 
                });
            }

        createNetwork(nodesData, edgesData);
    }
    </script>
</body>
</html>

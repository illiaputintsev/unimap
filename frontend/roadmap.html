<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Roadmap</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-y: auto;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 10px,
                    rgba(255,255,255,.05) 10px,
                    rgba(255,255,255,.05) 20px
                );
            pointer-events: none;
            z-index: 0;
        }
        h1 {
            text-align: center;
            color: #dc3545;
            margin: 20px 0 10px;
            font-size: 36px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }
        p {
            text-align: center;
            margin: 5px 0;
            position: relative;
            z-index: 1;
        }
        #roadmap {
            width: 95%;
            max-width: 1400px;
            margin: 20px auto;
            height: 800px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 50px;
            position: relative;
            z-index: 1;
            border: 3px solid #e0e0e0;
        }
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            background-color: white;
            padding: 30px;
            border: 3px solid #dc3545;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(220, 53, 69, 0.3);
            z-index: 2000;
            max-width: 400px;
            max-height: 85vh;
            overflow: auto;
            width: 350px;
        }
        .modal h2 {
            margin-top: 0;
            color: #dc3545;
            border-bottom: 2px solid #dc3545;
            padding-bottom: 10px;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 28px;
            color: #dc3545;
            font-weight: bold;
            transition: color 0.3s;
        }
        .modal-close:hover {
            color: #c82333;
        }
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .modal {
                top: 50%;
                right: 10px;
                transform: translateY(-50%);
                width: calc(100vw - 20px);
                max-width: none;
                max-height: 70vh;
            }
        }
        #logo {
            width: 200px;      
            height: auto;     
            transition: 0.3s; 
        }
        #logo:hover {
            width: 300px;
        }
        /* Menu button */
        #menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3);
            transition: all 0.3s;
        }
        #menu-btn:hover {
            background: linear-gradient(135deg, #c82333 0%, #bd2130 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(220, 53, 69, 0.4);
        }
        #menu-btn span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 3px 0;
            border-radius: 2px;
        }
        /* Menu dropdown */
        #menu-dropdown {
            display: none;
            position: fixed;
            top: 65px;
            left: 15px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            min-width: 180px;
        }
        #menu-dropdown a {
            display: block;
            padding: 12px 20px;
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }
        #menu-dropdown a:last-child {
            border-bottom: none;
        }
        #menu-dropdown a:hover {
            background-color: #fff5f5;
            color: #dc3545;
        }
        /* User info */
        #user-info {
            position: fixed;
            top: 70px;
            left: 15px;
            background: linear-gradient(135deg, white 0%, #fff5f5 100%);
            padding: 10px 18px;
            border-radius: 20px;
            box-shadow: 0 3px 10px rgba(220, 53, 69, 0.2);
            font-size: 13px;
            color: #dc3545;
            z-index: 999;
            border: 2px solid #ffc7ce;
            font-weight: 600;
        }
        .course-info {
            text-align: center;
            font-size: 15px;
            color: #555;
            margin: 8px 0;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- Menu Button -->
    <button id="menu-btn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>
    
    <!-- Menu Dropdown -->
    <div id="menu-dropdown">
        <a href="index.html">🏠 Home</a>
        <a href="login.html">🔑 Login</a>
        <a href="signup.html">📝 Sign Up</a>
        <a href="#" onclick="logout(); return false;">🚪 Logout</a>
    </div>

    <!-- User Info -->
    <div id="user-info">
        <span id="username">Guest</span>
    </div>

    <h1>Student Roadmap</h1>
    <p class="course-info" id="university-display"></p>
    <p id="input-display"></p>
    <img id="logo" src="assets\Gemini_Generated_Image_9eplpw9eplpw9epl__1_-removebg-preview.png" alt="Logo" style="position: fixed; top: 5px; right: 5px; cursor: default; z-index: 10;">
    <div id="roadmap"></div>

    <div id="node-modal" class="modal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <h2 id="modal-title"></h2>
        <p id="modal-content"></p>
    </div>

    <script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
    <script>
        // Get input from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const input = urlParams.get('input');
        const courseName = urlParams.get('course');
        const universityName = urlParams.get('university');
        
        // Display course and university info
        const firstNode = input ? input.split(',')[0].trim() : null;
        document.getElementById('input-display').textContent = firstNode ? `Tailored Roadmap for: ${courseName || firstNode}` : 'Sample roadmap (no input provided)';
        
        if (universityName) {
            const universityDisplayMap = {
                'ucl': 'University College London',
                'imperial': 'Imperial College London',
                'oxford': 'University of Oxford',
                'cambridge': 'University of Cambridge',
                'edinburgh': 'University of Edinburgh',
                'manchester': 'University of Manchester',
                'kcl': "King's College London"
            };
            document.getElementById('university-display').textContent = `📚 ${universityDisplayMap[universityName] || universityName}`;
        }
        
        // Check login status
        function checkLoginStatus() {
            const user = localStorage.getItem('currentUser');
            if (user) {
                const userData = JSON.parse(user);
                document.getElementById('username').textContent = userData.name || userData.email;
            } else {
                document.getElementById('username').textContent = 'Guest';
            }
        }
        
        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('currentUser');
                alert('Logged out successfully!');
                checkLoginStatus();
            }
        }
        
        // Initialize login status
        checkLoginStatus();
        
        // Draggable logo
        const logo = document.getElementById('logo');
        let isDragging = false;
        let offsetX, offsetY;

        // Sample data for the roadmap
        const sampleNodes = [
            { id: 1, label: 'Introduction to Programming' },
            { id: 2, label: 'Variables and Data Types' },
            { id: 3, label: 'Control Structures' },
            { id: 4, label: 'Functions' },
            { id: 5, label: 'Object-Oriented Programming' },
            { id: 6, label: 'Data Structures' },
            { id: 7, label: 'Algorithms' }
        ];
        const sampleEdges = [
            { from: 1, to: 2 },
            { from: 2, to: 3 },
            { from: 3, to: 4 },
            { from: 4, to: 5 },
            { from: 5, to: 6 },
            { from: 6, to: 7 }
        ];

        // Function to create the network
        function createNetwork(nodesData, edgesData) {
            const container = document.getElementById('roadmap');
            const data = { 
                nodes: new vis.DataSet(nodesData), 
                edges: new vis.DataSet(edgesData) 
            };

            const options = {
                autoResize: true,
                layout: {
                    hierarchical: {
                        direction: 'UD',
                        sortMethod: 'directed',
                        nodeSpacing: 150,
                        levelSeparation: 100 // Controls vertical gap between nodes
                    }
                },
                physics: false,
                interaction: {
                    dragNodes: false,
                    dragView: false,
                    zoomView: false // Disable zoom to allow page scroll with mouse wheel
                },
                nodes: {
                    color: {
                        background: '#dc3545',
                        border: '#c82333',
                        highlight: {
                            background: '#c82333',
                            border: '#bd2130'
                        },
                        hover: {
                            background: '#e15361',
                            border: '#dc3545'
                        }
                    },
                    shape: 'box',
                    margin: 12,
                    font: { 
                        size: 16, 
                        color: 'white',
                        face: 'Segoe UI',
                        bold: {
                            color: 'white'
                        }
                    },
                    borderWidth: 3,
                    borderWidthSelected: 4,
                    shadow: {
                        enabled: true,
                        color: 'rgba(220, 53, 69, 0.3)',
                        size: 10,
                        x: 3,
                        y: 3
                    },
                    shapeProperties: {
                        borderRadius: 8
                    }
                },
                edges: {
                    arrows: { to: { enabled: false } },
                    color: {
                        color: '#6c757d',
                        highlight: '#dc3545',
                        hover: '#dc3545'
                    },
                    width: 3,
                    smooth: {
                        type: 'cubicBezier',
                        forceDirection: 'vertical',
                        roundness: 0.4
                    },
                    shadow: {
                        enabled: true,
                        color: 'rgba(0,0,0,0.1)',
                        size: 5,
                        x: 2,
                        y: 2
                    }
                }
            };

            const network = new vis.Network(container, data, options);

            // Prevent canvas from capturing scroll wheel - allow page scroll
            container.addEventListener('wheel', (e) => {
                // Let the event bubble up to allow page scrolling
                return true;
            }, { passive: true });

            // Calculate and set container height based on number of nodes
            const nodeCount = nodesData.length;
            const levelSeparation = 100;
            const estimatedHeight = Math.max(800, (nodeCount * levelSeparation) + 400);
            container.style.height = estimatedHeight + 'px';

            // Show all nodes and position properly
            network.once('stabilized', function() {
                // Fit all nodes in view
                network.fit({ animation: false });
                // Scroll page to top
                window.scrollTo(0, 0);
            });

            // POPUP LOGIC: Re-adding the click event
            network.on('click', function(params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const node = nodesData.find(n => n.id === nodeId);
                    if (node) {
                        document.getElementById('modal-title').textContent = node.label;
                        document.getElementById('modal-content').textContent = `Step ${node.id}: Detailed resources for learning ${node.label} will appear here`;
                        document.getElementById('node-modal').style.display = 'block';
                    }
                }
            });
        }

        function closeModal() {
            document.getElementById('node-modal').style.display = 'none';
        }

        function toggleMenu() {
            const menu = document.getElementById('menu-dropdown');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        // Close menu when clicking outside
        window.addEventListener('click', function(e) {
            const menu = document.getElementById('menu-dropdown');
            const menuBtn = document.getElementById('menu-btn');
            if (!menuBtn.contains(e.target) && !menu.contains(e.target)) {
                menu.style.display = 'none';
            }
        });

        if (input) {
            const moduleNames = input.split(',').map(name => name.trim()).filter(name => name);
    
            // Create Nodes
            const nodesData = moduleNames.map((name, index) => ({ 
                id: index + 1, 
                label: name 
            }));

            // Create a Chain (1 -> 2 -> 3 -> 4...)
            const edgesData = [];
            for (let i = 0; i < nodesData.length - 1; i++) {
                edgesData.push({ 
                    from: nodesData[i].id, 
                    to: nodesData[i+1].id 
                });
            }

        createNetwork(nodesData, edgesData);
    }
    </script>
</body>
</html>

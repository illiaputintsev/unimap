<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Roadmap</title>
    <link rel="stylesheet" href="frame-styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.0.0/dist/vis-network.min.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-y: auto;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 10px,
                    rgba(255,255,255,.05) 10px,
                    rgba(255,255,255,.05) 20px
                );
            pointer-events: none;
            z-index: 0;
        }
        h1 {
            text-align: center;
            color: #1abc9c;
            margin: 20px 0 10px;
            font-size: 36px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }
        p {
            text-align: center;
            margin: 5px 0;
            position: relative;
            z-index: 1;
        }
        #roadmap {
            width: 95%;
            max-width: 1400px;
            margin: 20px auto;
            min-height: 600px;
            height: auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 50px;
            position: relative;
            z-index: 1;
            border: 3px solid #e0e0e0;
        }
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            background-color: white;
            padding: 30px;
            border: 3px solid #1abc9c;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(220, 53, 69, 0.3);
            z-index: 2000;
            max-width: 400px;
            max-height: 85vh;
            overflow: auto;
            width: 350px;
        }
        .modal h2 {
            margin-top: 0;
            color: #1abc9c;
            border-bottom: 2px solid #1abc9c;
            padding-bottom: 10px;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 28px;
            color: #1abc9c;
            font-weight: bold;
            transition: color 0.3s;
        }
        .modal-close:hover {
            color: #16a085;
        }
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .modal {
                top: 50%;
                right: 10px;
                transform: translateY(-50%);
                width: calc(100vw - 20px);
                max-width: none;
                max-height: 70vh;
            }
            
            #progress-container {
                top: 250px;
                right: 10px;
                width: 40px;
                height: 40px;
                padding: 0;
            }
            
            #progress-text {
                font-size: 11px;
            }
            
            #level-container {
                top: 305px;
                right: 10px;
                width: 40px;
                height: 40px;
                padding: 0;
            }
            
            #level-badge {
                width: 40px;
                height: 40px;
                font-size: 24px;
            }
            
            #xp-text {
                font-size: 10px;
            }
        }
        #logo {
            width: 200px;      
            height: auto;     
            transition: 0.3s; 
        }
        #logo:hover {
            width: 300px;
        }
        /* Menu button */
        #menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3);
            transition: all 0.3s;
        }
        #menu-btn:hover {
            background: linear-gradient(135deg, #16a085 0%, #a01810 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(220, 53, 69, 0.4);
        }
        #menu-btn span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 3px 0;
            border-radius: 2px;
        }
        /* Menu dropdown */
        #menu-dropdown {
            display: none;
            position: fixed;
            top: 65px;
            left: 15px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            min-width: 250px;
            max-height: 400px;
            overflow-y: auto;
        }
        #menu-dropdown a, #menu-dropdown .menu-section {
            display: block;
            padding: 12px 20px;
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }
        #menu-dropdown a:hover {
            background-color: #fff5f5;
            color: #1abc9c;
        }
        .menu-section {
            background-color: #f9f9f9;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            cursor: default;
        }
        .menu-section:hover {
            background-color: #f9f9f9;
            color: #666;
        }
        #module-input-container {
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        #module-input-container input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
            margin-bottom: 8px;
        }
        #module-input-container button {
            width: 100%;
            padding: 8px;
            background-color: #1abc9c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        #module-input-container button:hover {
            background-color: #16a085;
        }
        /* User info */
        #user-info {
            position: fixed;
            top: 70px;
            left: 15px;
            background: linear-gradient(135deg, white 0%, #fff5f5 100%);
            padding: 10px 18px;
            border-radius: 20px;
            box-shadow: 0 3px 10px rgba(26, 188, 156, 0.15);
            font-size: 13px;
            color: #1abc9c;
            z-index: 999;
            border: 2px solid #c8f7f0;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #profile-pic-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            display: none;
            margin-left: auto;
        }
        #profile-pic-avatar.show {
            display: block;
        }
        .course-info {
            text-align: center;
            font-size: 15px;
            color: #555;
            margin: 8px 0;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }
        /* Progress Bar - Collapsible Icon */
        #progress-container {
            position: fixed;
            top: 250px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: white;
            padding: 0;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(26, 188, 156, 0.2);
            z-index: 999;
            border: 2px solid #c8f7f0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        #progress-container:hover {
            width: 250px;
            border-radius: 10px;
            height: auto;
            padding: 15px;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
        }
        #progress-container:hover .progress-icon {
            display: none;
        }
        #progress-container:hover .progress-content {
            display: block;
        }
        .progress-icon {
            display: block;
        }
        .progress-content {
            display: none;
            width: 100%;
        }
        .progress-content .progress-title {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
        }
        #progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }
        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1abc9c 0%, #16a085 100%);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 10px;
        }
        #progress-text {
            font-size: 12px;
            color: #1abc9c;
            font-weight: 600;
            text-align: center;
            margin-top: 8px;
        }
        
        /* Level/XP Display - Collapsible Icon */
        #level-container {
            position: fixed;
            top: 305px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #fff8f0 0%, #fff0e8 100%);
            padding: 0;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(26, 188, 156, 0.2);
            z-index: 999;
            border: 2px solid #ffd9b3;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        #level-container:hover {
            width: 250px;
            border-radius: 10px;
            height: auto;
            padding: 15px;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
        }
        #level-container:hover .level-icon {
            display: none;
        }
        #level-container:hover .level-content {
            display: block;
        }
        .level-icon {
            display: block;
        }
        .level-content {
            display: none;
            width: 100%;
        }
        #level-display {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: #d97845;
        }
        #level-badge {
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ffa500 0%, #ff8c00 100%);
            border-radius: 50%;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.3);
        }
        #level-info {
            flex: 1;
        }
        #level-number {
            font-size: 16px;
            color: #d97845;
        }
        #xp-bar {
            width: 100%;
            height: 6px;
            background: #f0e0d0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 6px;
        }
        #xp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffa500 0%, #ff8c00 100%);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 10px;
        }
        #xp-text {
            font-size: 11px;
            color: #d97845;
            font-weight: 600;
            text-align: center;
            margin-top: 4px;
        }
        
        /* Node Hover Animation */
        .vis-network canvas {
            transition: all 0.2s ease;
        }
        .node-hover-glow {
            filter: drop-shadow(0 0 15px rgba(26, 188, 156, 0.6));
            transform: scale(1.1);
        }
        
        /* Canvas node fade-in animation */
        #roadmap {
            animation: containerFadeIn 0.5s ease-in;
        }
        @keyframes containerFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes levelUpPop {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
        @keyframes fadeOut {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Menu Button -->
    <button id="menu-btn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>
    
    <!-- Menu Dropdown -->
    <div id="menu-dropdown">
        <div class="menu-section">📚 Manage Modules</div>
        <div id="module-input-container">
            <input 
                type="text" 
                id="new-module-input" 
                placeholder="Add new module..." 
                onkeypress="if(event.key==='Enter') addModuleToRoadmap()"
            >
            <button onclick="addModuleToRoadmap()">Add Module</button>
        </div>
        
        <a href="profile.html">⚙️ Profile Settings</a>
        <a href="#" id="my-roads-btn" style="display: none;" onclick="openMyRoadmaps(); return false;">🗺️ My Roadmaps</a>
        <a href="#" onclick="openAchievements(); return false;">🏆 Achievements</a>
        <a href="progress.html">📊 Your Progress</a>
        <a href="index.html">🏠 Home</a>
        <a href="login.html">🔑 Login</a>
        <a href="signup.html">📝 Sign Up</a>
        <a href="#" onclick="logout(); return false;">🚪 Logout</a>
    </div>

    <!-- User Info -->
    <div id="user-info">
        <span id="username">Guest</span>
        <img id="profile-pic-avatar" alt="Profile">
    </div>

    <!-- Progress Container -->
    <div id="progress-container">
        <div class="progress-icon">📈</div>
        <div class="progress-content">
            <div class="progress-title">📈 Progress</div>
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div id="progress-text">0/0 Modules</div>
        </div>
    </div>
    
    <!-- Level/XP Container -->
    <div id="level-container">
        <div class="level-icon">⭐</div>
        <div class="level-content">
            <div id="level-display">
                <div id="level-badge">⭐</div>
                <div id="level-info">
                    <div id="level-number">Level 1</div>
                    <div id="xp-bar">
                        <div id="xp-fill"></div>
                    </div>
                    <div id="xp-text">0 / 200 XP</div>
                </div>
            </div>
        </div>
    </div>

    <h1>Student Roadmap</h1>
    <p class="course-info" id="university-display"></p>
    <p id="input-display"></p>
    <img id="logo" src="assets\Gemini_Generated_Image_9eplpw9eplpw9epl__1_-removebg-preview.png" alt="Logo" style="position: fixed; top: 5px; right: 5px; cursor: default; z-index: 10;">
    <div id="roadmap"></div>

    <div id="node-modal" class="modal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <h2 id="modal-title"></h2>
        <p id="modal-content"></p>
        <button id="quiz-button" style="margin-top: 15px; padding: 10px 20px; background-color: #1abc9c; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600;" onclick="openQuiz()">📝 Take Quiz</button>
        <p id="quiz-score" style="margin-top: 10px; font-size: 14px; color: #666; display: none;"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.0.0/dist/vis-network.min.js"></script>
    <script src="api-service.js"></script>
    <script>
        // XP and Leveling System - Define early to avoid ReferenceError
        const levelThresholds = [
            0,    // Level 1
            200,  // Level 2
            500,  // Level 3
            900,  // Level 4
            1400, // Level 5
            2000, // Level 6
            2700, // Level 7
            3500, // Level 8
            4400, // Level 9
            5400  // Level 10
        ];
        
        // Get input from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const input = urlParams.get('input');
        const courseName = urlParams.get('course');
        const universityName = urlParams.get('university');
        const roadmapIdParam = urlParams.get('roadmap_id');
        let currentRoadmap = null;
        let moduleTopicMap = new Map();
        let modulesById = new Map();
        
        // Display course and university info
        const firstNode = input ? input.split(',')[0].trim() : null;
        if (roadmapIdParam) {
            document.getElementById('input-display').textContent = 'Loading roadmap...';
        } else {
            document.getElementById('input-display').textContent = firstNode ? `Tailored Roadmap for: ${courseName || firstNode}` : 'Sample roadmap (no input provided)';
        }
        
        if (universityName) {
            const universityDisplayMap = {
                'ucl': 'University College London',
                'imperial': 'Imperial College London',
                'oxford': 'University of Oxford',
                'cambridge': 'University of Cambridge',
                'edinburgh': 'University of Edinburgh',
                'manchester': 'University of Manchester',
                'kcl': "King's College London"
            };
            document.getElementById('university-display').textContent = `📚 ${universityDisplayMap[universityName] || universityName}`;
        }
        
        // Check login status
        function checkLoginStatus() {
            const user = localStorage.getItem('currentUser');
            const profilePic = document.getElementById('profile-pic-avatar');
            
            if (ApiService.isAuthenticated() && user) {
                const userData = JSON.parse(user);
                document.getElementById('username').textContent = userData.username || userData.email || 'User';
                
                // Load and display profile picture if available
                const profilePictureData = localStorage.getItem('profilePictureData');
                if (profilePictureData) {
                    profilePic.src = profilePictureData;
                    profilePic.classList.add('show');
                    
                    // Apply selected frame
                    applyProfileFrame(profilePic);
                } else {
                    profilePic.classList.remove('show');
                }
                
                // Show My Roadmaps button for logged-in users
                const myRoadsBtn = document.getElementById('my-roads-btn');
                if (myRoadsBtn) myRoadsBtn.style.display = 'block';
                
                // Initialize achievements and level system for this user
                initAchievements();
                initUserLevel();
            } else {
                document.getElementById('username').textContent = 'Guest';
                profilePic.classList.remove('show');
            }
        }
        
        // Apply selected frame to profile picture
        function applyProfileFrame(profilePic) {
            const selectedFrame = localStorage.getItem('selectedProfileFrame') || 'none';
            
            // Remove all frame classes
            profilePic.classList.remove('profile-pic-none', 'profile-pic-basic', 'profile-pic-intermediary', 'profile-pic-master');
            
            // Add the selected frame class
            if (selectedFrame !== 'none') {
                profilePic.classList.add('profile-pic-' + selectedFrame);
            } else {
                profilePic.classList.add('profile-pic-none');
            }
        }
        
        // Save roadmap state to localStorage
        function saveRoadmapState() {
            if (!window.network || !window.nodes) return;
            
            const state = {
                nodes: window.nodes.get(),
                edges: window.edges.get(),
                viewportState: {
                    scale: window.network.getScale(),
                    position: window.network.getViewPosition()
                },
                inputModules: document.getElementById('input-display')?.textContent || ''
            };
            
            localStorage.setItem('roadmapState', JSON.stringify(state));
        }
        
        // Restore roadmap state from localStorage
        function restoreRoadmapState() {
            const savedState = localStorage.getItem('roadmapState');
            if (savedState) {
                try {
                    const state = JSON.parse(savedState);
                    // State will be restored after network initialization
                    return state;
                } catch (e) {
                    console.error('Error restoring roadmap state:', e);
                }
            }
            return null;
        }
        
        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                ApiService.logout();
                localStorage.removeItem('currentUser');
                // Hide My Roadmaps button
                const myRoadsBtn = document.getElementById('my-roads-btn');
                if (myRoadsBtn) myRoadsBtn.style.display = 'none';
                alert('Logged out successfully!');
                checkLoginStatus();
            }
        }
        
        // Open My Roadmaps modal
        let myRoadmapsEditMode = false;
        
        async function openMyRoadmaps() {
            if (!ApiService.isAuthenticated()) {
                alert('Please login to view your roadmaps');
                return;
            }
            myRoadmapsEditMode = false;
            
            let html = '<h2>🗺️ My Roadmaps</h2>';
            html += '<p style="color: #666; text-align: center; padding: 10px;">Loading...</p>';
            
            const modal = document.querySelector('.modal');
            if (modal) {
                modal.innerHTML = html;
                modal.style.display = 'block';
            }

            const response = await ApiService.listRoadmaps();
            if (!response.ok) {
                if (modal) {
                    modal.innerHTML = '<h2>🗺️ My Roadmaps</h2><p style="color: #c33; text-align: center; padding: 20px;">Failed to load roadmaps.</p>' +
                        '<button onclick="closeModal()" style="width: 100%; margin-top: 15px; padding: 10px; background: #1abc9c; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Close</button>';
                }
                return;
            }

            const roadmaps = response.data || [];
            renderMyRoadmaps(roadmaps, false);
        }

        function renderMyRoadmaps(roadmaps, editMode) {
            const modal = document.querySelector('.modal');
            if (!modal) return;
            
            myRoadmapsEditMode = editMode;
            
            // Header with Edit/Done button
            let html = '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">';
            html += '<h2 style="margin: 0;">🗺️ My Roadmaps</h2>';
            if (roadmaps.length > 0) {
                if (editMode) {
                    html += '<button onclick="toggleMyRoadmapsEdit()" style="padding: 6px 16px; border: none; border-radius: 6px; background: #1abc9c; color: white; font-size: 13px; font-weight: 700; cursor: pointer;">Done</button>';
                } else {
                    html += '<button onclick="toggleMyRoadmapsEdit()" style="padding: 6px 16px; border: none; border-radius: 6px; background: #3498db; color: white; font-size: 13px; font-weight: 700; cursor: pointer;">✏️ Edit</button>';
                }
            }
            html += '</div>';
            
            if (roadmaps.length === 0) {
                html += '<p style="color: #666; text-align: center; padding: 20px;">No roadmaps yet. Generate one from the Home page.</p>';
            } else {
                html += '<div id="my-roadmaps-list" style="display: flex; flex-direction: column; gap: 10px;">';
                roadmaps.forEach(roadmap => {
                    const dateText = roadmap.created_at ? new Date(roadmap.created_at).toLocaleDateString() : 'Unknown date';
                    const title = roadmap.title || 'Untitled Roadmap';
                    
                    if (editMode) {
                        // Edit mode: show rename input + delete button
                        html += `
                            <div style="padding: 12px; background-color: #f5f5f5; border-radius: 8px; border-left: 4px solid #3498db; display: flex; align-items: center; gap: 8px;">
                                <div style="flex: 1;">
                                    <input type="text" id="rename-${roadmap.id}" value="${title.replace(/"/g, '&quot;')}" 
                                        style="width: 100%; padding: 6px 10px; border: 2px solid #3498db; border-radius: 6px; font-size: 14px; font-weight: 600; box-sizing: border-box;"
                                        onkeydown="if(event.key==='Enter') renameRoadmap(${roadmap.id})" />
                                    <small style="color: #999;">${dateText}</small>
                                </div>

        /**
         * Topological sort of nodes based on edges (prerequisites come first).
         * Uses Kahn's algorithm with fallback to order property.
         * @param {Array} nodes - Array of node objects
         * @param {Array} edges - Array of edge objects with from/to properties
         * @returns {Array} Sorted array of nodes
         */
        function topologicalSort(nodes, edges) {
            const nodeMap = new Map(nodes.map(n => [n.id, n]));
            const inDegree = new Map();
            const adjList = new Map();
            
            // Initialize
            nodes.forEach(node => {
                inDegree.set(node.id, 0);
                adjList.set(node.id, []);
            });
            
            // Build adjacency list and in-degree count
            edges.forEach(edge => {
                if (adjList.has(edge.from) && inDegree.has(edge.to)) {
                    adjList.get(edge.from).push(edge.to);
                    inDegree.set(edge.to, inDegree.get(edge.to) + 1);
                }
            });
            
            // Start with nodes that have no prerequisites (in-degree 0)
            const queue = [];
            nodes.forEach(node => {
                if (inDegree.get(node.id) === 0) {
                    queue.push(node);
                }
            });
            
            // Sort nodes with in-degree 0 by their order property
            queue.sort((a, b) => (a.order || 0) - (b.order || 0));
            
            const result = [];
            
            while (queue.length > 0) {
                const current = queue.shift();
                result.push(current);
                
                // Get neighbors and sort by order
                const neighbors = adjList.get(current.id) || [];
                neighbors.forEach(neighborId => {
                    inDegree.set(neighborId, inDegree.get(neighborId) - 1);
                    if (inDegree.get(neighborId) === 0) {
                        const neighborNode = nodeMap.get(neighborId);
                        if (neighborNode) {
                            // Insert in order-sorted position
                            let inserted = false;
                            for (let i = 0; i < queue.length; i++) {
                                if ((neighborNode.order || 0) < (queue[i].order || 0)) {
                                    queue.splice(i, 0, neighborNode);
                                    inserted = true;
                                    break;
                                }
                            }
                            if (!inserted) queue.push(neighborNode);
                        }
                    }
                });
            }
            
            // Handle any remaining nodes (cycles or disconnected)
            nodes.forEach(node => {
                if (!result.find(n => n.id === node.id)) {
                    result.push(node);
                }
            });
            
            return result;
        }

        /**
         * Infer module years from prerequisite edges using topological ordering.
         * Modules with no prerequisites start at Year 1.
         * A module's year = max(year of all prerequisites) + 1, capped at 3.
         * @param {Array} modules - Array of module objects with id property
         * @param {Array} edges - Array of edge objects with source/from and target/to properties
         * @returns {Map} Map of moduleId -> inferred year (1, 2, or 3)
         */
        function inferYearsFromEdges(modules, edges) {
            const yearMap = new Map();
            const moduleIds = new Set(modules.map(m => String(m.id)));
            
            // Build adjacency list (incoming edges for each node)
            const incomingEdges = new Map();
            const outgoingEdges = new Map();
            moduleIds.forEach(id => {
                incomingEdges.set(id, []);
                outgoingEdges.set(id, []);
            });
            
            edges.forEach(edge => {
                const from = String(edge.source || edge.from);
                const to = String(edge.target || edge.to);
                if (moduleIds.has(from) && moduleIds.has(to)) {
                    incomingEdges.get(to).push(from);
                    outgoingEdges.get(from).push(to);
                }
            });
            
            // Initialize all modules to year 0 (unassigned)
            moduleIds.forEach(id => yearMap.set(id, 0));
            
            // Use BFS/topological approach: process nodes level by level
            // Nodes with no incoming edges start at Year 1
            const queue = [];
            moduleIds.forEach(id => {
                if (incomingEdges.get(id).length === 0) {
                    yearMap.set(id, 1);
                    queue.push(id);
                }
            });
            
            // Process queue: for each node, update its dependents
            while (queue.length > 0) {
                const currentId = queue.shift();
                const currentYear = yearMap.get(currentId);
                
                outgoingEdges.get(currentId).forEach(dependentId => {
                    // Dependent's year should be at least current + 1
                    const newYear = Math.min(currentYear + 1, 3);
                    if (newYear > yearMap.get(dependentId)) {
                        yearMap.set(dependentId, newYear);
                    }
                    
                    // Check if all prerequisites of dependent have been assigned
                    const allPrereqsAssigned = incomingEdges.get(dependentId).every(prereq => yearMap.get(prereq) > 0);
                    if (allPrereqsAssigned && !queue.includes(dependentId)) {
                        // Recalculate year based on all prerequisites
                        const maxPrereqYear = Math.max(...incomingEdges.get(dependentId).map(prereq => yearMap.get(prereq)));
                        yearMap.set(dependentId, Math.min(maxPrereqYear + 1, 3));
                        queue.push(dependentId);
                    }
                });
            }
            
            // Handle any remaining unassigned nodes (cycles or disconnected)
            moduleIds.forEach(id => {
                if (yearMap.get(id) === 0) {
                    // If has incoming edges, calculate from prerequisites; otherwise Year 1
                    const prereqs = incomingEdges.get(id);
                    if (prereqs.length > 0) {
                        const assignedPrereqs = prereqs.filter(p => yearMap.get(p) > 0);
                        if (assignedPrereqs.length > 0) {
                            const maxYear = Math.max(...assignedPrereqs.map(p => yearMap.get(p)));
                            yearMap.set(id, Math.min(maxYear + 1, 3));
                        } else {
                            yearMap.set(id, 1);
                        }
                    } else {
                        yearMap.set(id, 1);
                    }
                }
            });
            
            return yearMap;
        }

        function buildNetworkFromRoadmap(roadmap) {
            currentRoadmap = roadmap;
            modulesById = new Map();
            moduleTopicMap = new Map();

            const modules = (roadmap.modules || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
            const nodesData = [];
            const edgesData = [];
            
            // First extract edges data for year inference (exclude 'contains' module→topic edges)
            const rawEdges = [];
            if (Array.isArray(roadmap.edges)) {
                roadmap.edges.forEach(edge => {
                    if (edge.edge_type === 'contains') return;
                    rawEdges.push({ source: String(edge.source), target: String(edge.target) });
                });
            }
            
            // Infer years from prerequisite relationships (edges)
            const inferredYears = inferYearsFromEdges(modules, rawEdges);
            
            // Determine year for each module based on:
            // 1. module.year property (if exists)
            // 2. module.level property (if exists)  
            // 3. Inferred from prerequisite edges
            // 4. Fallback: divide modules into 3 years by order
            const totalModules = modules.length;
            const modulesPerYear = Math.ceil(totalModules / 3);
            
            modules.forEach((module, index) => {
                const moduleId = String(module.id);
                modulesById.set(moduleId, { ...module, id: moduleId });
                
                // Determine year: use explicit year/level, infer from edges, or fallback to order
                let year = 1;
                if (module.year !== undefined) {
                    year = module.year;
                } else if (module.level !== undefined) {
                    year = module.level;
                } else if (inferredYears.has(moduleId) && inferredYears.get(moduleId) > 0) {
                    // Use year inferred from prerequisite edges
                    year = inferredYears.get(moduleId);
                } else {
                    // Fallback: Infer year from order (distribute across 3 years)
                    year = Math.floor(index / modulesPerYear) + 1;
                    year = Math.min(year, 3); // Cap at year 3
                }
                
                // Add module node with year info
                nodesData.push({ 
                    id: moduleId, 
                    label: module.title,
                    year: year,
                    order: module.order || index
                });
                
                // Store topics for modal display
                if (module.topics && module.topics.length > 0) {
                    moduleTopicMap.set(moduleId, module.topics[0].id);
                }
            });
            
            // Use ONLY dependency edges between modules (exclude 'contains' edges which are module→topic)
            if (Array.isArray(roadmap.edges)) {
                const nodeIds = new Set(nodesData.map(n => String(n.id)));
                
                // Build a set of all topic IDs so we can exclude edges involving topics
                const topicIdSet = new Set();
                modules.forEach(module => {
                    (module.topics || []).forEach(topic => {
                        if (topic.id) topicIdSet.add(String(topic.id));
                    });
                });
                
                // Debug: log all edges with their edge_type
                const edgesByType = {};
                roadmap.edges.forEach(edge => {
                    const t = edge.edge_type || 'unknown';
                    if (!edgesByType[t]) edgesByType[t] = [];
                    edgesByType[t].push({ source: edge.source, target: edge.target });
                });
                console.log('=== buildNetworkFromRoadmap EDGE DEBUG ===');
                console.log('Total raw edges:', roadmap.edges.length);
                console.log('Edge types:', Object.keys(edgesByType).map(t => t + ': ' + edgesByType[t].length).join(', '));
                console.log('Edges by type:', JSON.stringify(edgesByType, null, 2));
                console.log('Topic IDs:', [...topicIdSet]);
                
                roadmap.edges.forEach(edge => {
                    // Skip 'contains' edges — those are module→topic parent-child relationships
                    if (edge.edge_type === 'contains') return;
                    const from = String(edge.source);
                    const to = String(edge.target);
                    // Skip edges where source or target is a topic node
                    if (topicIdSet.has(from) || topicIdSet.has(to)) return;
                    if (nodeIds.has(from) && nodeIds.has(to)) {
                        edgesData.push({ from, to });
                    }
                });
                
                // Debug: Professional Practice edges
                const ppNode = nodesData.find(n => n.label && n.label.toLowerCase().includes('professional practice'));
                if (ppNode) {
                    const ppId = String(ppNode.id);
                    const ppEdgesAll = roadmap.edges.filter(e => String(e.source) === ppId || String(e.target) === ppId);
                    console.log('Professional Practice (id=' + ppId + ') ALL raw edges:', JSON.stringify(ppEdgesAll));
                    const ppEdgesFiltered = edgesData.filter(e => String(e.from) === ppId || String(e.to) === ppId);
                    console.log('Professional Practice FILTERED edges:', JSON.stringify(ppEdgesFiltered));
                }
                console.log('Final edgesData count:', edgesData.length);
            }

            const titleText = roadmap.title || (roadmap.course && roadmap.course.title) || 'Student Roadmap';
            document.getElementById('input-display').textContent = `Tailored Roadmap for: ${titleText}`;
            if (roadmap.course && roadmap.course.university) {
                document.getElementById('university-display').textContent = `📚 ${roadmap.course.university}`;
            } else if (roadmap.manual_course_title) {
                document.getElementById('university-display').textContent = `📚 ${roadmap.manual_course_title}`;
            }

            createNetwork(nodesData, edgesData);
        }

        function resizeRoadmapContainerToGraph(container, network, nodesData) {
            if (!container || !network || !nodesData || nodesData.length === 0) return;

            try {
                const nodeIds = nodesData.map(node => node.id);
                const positions = network.getPositions(nodeIds);
                const coords = Object.values(positions);
                if (!coords.length) return;

                const xs = coords.map(p => p.x);
                const ys = coords.map(p => p.y);

                const graphWidth = Math.max(...xs) - Math.min(...xs);
                const graphHeight = Math.max(...ys) - Math.min(...ys);

                const targetWidth = Math.min(Math.max(Math.ceil(graphWidth + 700), 1200), 1900);
                const targetHeight = Math.min(Math.max(Math.ceil(graphHeight + 700), 700), 2800);

                container.style.width = '95%';
                container.style.maxWidth = `${targetWidth}px`;
                container.style.minHeight = `${targetHeight}px`;
                container.style.height = `${targetHeight}px`;

                network.setSize('100%', `${targetHeight}px`);
                network.redraw();
            } catch (error) {
                console.error('Error resizing roadmap container:', error);
            }
        }

        function addXP(amount) {
            const user = localStorage.getItem('currentUser');
            if (!user) return;
            
            const userData = JSON.parse(user);
            const userXPKey = `user-xp-${userData.email}`;

            currentXP += amount;
            
            // Check for level ups
            while (currentLevel < levelThresholds.length && currentXP >= levelThresholds[currentLevel]) {
                currentLevel++;
                showLevelUpNotification(currentLevel);
                addLevelAchievement(currentLevel);

            updateLevelDisplay();
            checkAchievements();
        }

        function calculateQuizXP(score) {
            let xp = 100; // Base XP
            
            if (score >= 50) {
                // Bonus XP: 20 XP per 10% above 50%
                const bonusPercent = Math.floor((score - 50) / 10);
                xp += bonusPercent * 20;
            }
            
            return Math.min(xp, 200); // Max 200 XP per quiz
        }

        function updateLevelDisplay() {
            const user = localStorage.getItem('currentUser');
            if (!user) return;
            
            const userData = JSON.parse(user);
            const userLevelKey = `user-level-${userData.email}`;
            const userXPKey = `user-xp-${userData.email}`;
            
            const currentLevel = parseInt(localStorage.getItem(userLevelKey)) || 1;
            const currentXP = parseInt(localStorage.getItem(userXPKey)) || 0;
            
            const levelNumber = document.getElementById('level-number');
            const xpBar = document.getElementById('xp-fill');
            const xpText = document.getElementById('xp-text');
            
            if (currentLevel >= levelThresholds.length) {
                // Max level reached
                if (levelNumber) levelNumber.textContent = `Level ${currentLevel} (MAX)`;
                if (xpBar) xpBar.style.width = '100%';
                if (xpText) xpText.textContent = `${currentXP} XP (Max Level)`;
                return;
            }
            
            const currentLevelXP = levelThresholds[currentLevel - 1];
            const nextLevelXP = levelThresholds[currentLevel];
            const xpInCurrentLevel = currentXP - currentLevelXP;
            const xpNeededForLevel = nextLevelXP - currentLevelXP;
            const progressPercent = (xpInCurrentLevel / xpNeededForLevel) * 100;
            
            if (levelNumber) levelNumber.textContent = `Level ${currentLevel}`;
            if (xpBar) xpBar.style.width = Math.min(progressPercent, 100) + '%';
            if (xpText) xpText.textContent = `${xpInCurrentLevel} / ${xpNeededForLevel} XP`;
        }

                    const graphResponse = await ApiService.getRoadmapGraph(roadmapIdParam);

                        const extractModulesFromPayload = (payload) => {
                            if (!payload || typeof payload !== 'object') return [];
                            if (Array.isArray(payload.modules)) return payload.modules;
                            if (payload.roadmap && Array.isArray(payload.roadmap.modules)) return payload.roadmap.modules;
                            if (payload.data && Array.isArray(payload.data.modules)) return payload.data.modules;
                            return [];
                        };

                        const moduleNodes = (graphData.nodes || [])
                            .filter(node => node.type === 'module')
                            .sort((a, b) => (a.order || 0) - (b.order || 0));
                        const topicNodes = (graphData.nodes || [])
                            .filter(node => node.type === 'topic');

                        // Fetch full roadmap details and prefer it when it has more modules than graph payload
                        let fullRoadmap = null;
                        const fullRoadmapResponse = await ApiService.getRoadmap(roadmapIdParam);
                        if (fullRoadmapResponse.ok) {
                            fullRoadmap = fullRoadmapResponse.data;
                        }

                        const fullRoadmapModules = extractModulesFromPayload(fullRoadmap);
                        const graphPayloadModules = extractModulesFromPayload(graphData);
                        const roadmapModuleCache = JSON.parse(localStorage.getItem('roadmapModuleCache') || '{}');
                        const cachedModules = Array.isArray(roadmapModuleCache[String(roadmapIdParam)])
                            ? roadmapModuleCache[String(roadmapIdParam)]
                            : [];

                        let modulesForDisplay;
                        if (fullRoadmapModules.length > 0) {
                            modulesForDisplay = fullRoadmapModules
                                .slice()
                                .sort((a, b) => (a.order || 0) - (b.order || 0))
                                .map((module, index) => ({
                                    id: module.id ?? module.module_id ?? `full-${index + 1}`,
                                    title: module.title,
                                    description: module.description || '',
                                    topics: (module.topics || [])
                                        .slice()
                                        .sort((a, b) => (a.order || 0) - (b.order || 0))
                                        .map(topic => ({ id: topic.id, title: topic.title, description: topic.description || '' }))
                                }));
                        } else if (graphPayloadModules.length > 0) {
                            modulesForDisplay = graphPayloadModules
                                .slice()
                                .sort((a, b) => (a.order || 0) - (b.order || 0))
                                .map((module, index) => ({
                                    id: module.id ?? module.module_id ?? `graph-${index + 1}`,
                                    title: module.title,
                                    description: module.description || '',
                                    topics: (module.topics || [])
                                        .slice()
                                        .sort((a, b) => (a.order || 0) - (b.order || 0))
                                        .map(topic => ({ id: topic.id, title: topic.title, description: topic.description || '' }))
                                }));
                        } else {
                            modulesForDisplay = moduleNodes.map(moduleNode => ({
                                id: moduleNode.id,
                                title: moduleNode.title,
                                description: moduleNode.description || '',
                                topics: topicNodes
                                    .filter(topic => topic.parent_module_id === moduleNode.id)
                                    .sort((a, b) => (a.order || 0) - (b.order || 0))
                                    .map(topic => ({ id: topic.id, title: topic.title, description: topic.description || '' }))
                            }));
                        }

                        if (cachedModules.length > 0) {
                            const existingTitles = new Set(
                                modulesForDisplay
                                    .map(module => String(module.title || '').trim().toLowerCase())
                                    .filter(Boolean)
                            );
                            const missingCached = cachedModules
                                .filter(title => title && !existingTitles.has(String(title).trim().toLowerCase()))
                                .map((moduleTitle, index) => ({
                                    id: `cached-${index + 1}`,
                                    title: moduleTitle,
                                    description: '',
                                    topics: []
                                }));
                            modulesForDisplay = modulesForDisplay.concat(missingCached);
                        }

                        const seenModuleIds = new Set();
                        modulesForDisplay = modulesForDisplay
                            .filter(module => module && module.title)
                            .map((module, index) => {
                                let resolvedId = module.id;
                                if (resolvedId === undefined || resolvedId === null || seenModuleIds.has(String(resolvedId))) {
                                    resolvedId = `module-${index + 1}`;
                                }
                                seenModuleIds.add(String(resolvedId));
                                return {
                                    ...module,
                                    id: String(resolvedId)
                                };
                            });

                        // Extract edges for year inference (exclude 'contains' edges)
                        const rawEdgesForInference = (graphData.edges || [])
                            .filter(e => e.edge_type !== 'contains')
                            .map(e => ({
                                source: String(e.source),
                                target: String(e.target)
                            }));
                        
                        // Infer years from prerequisite relationships
                        const inferredYears = inferYearsFromEdges(modulesForDisplay, rawEdgesForInference);
                        
                        // Calculate year distribution (fallback)
                        const totalModules = modulesForDisplay.length;
                        const modulesPerYear = Math.ceil(totalModules / 3);
                        
                        const nodesData = modulesForDisplay.map((moduleNode, index) => {
                            // Determine year from module data, edges, or infer from order
                            let year = 1;
                            const moduleId = String(moduleNode.id);
                            if (moduleNode.year !== undefined) {
                                year = moduleNode.year;
                            } else if (moduleNode.level !== undefined) {
                                year = moduleNode.level;
                            } else if (inferredYears.has(moduleId) && inferredYears.get(moduleId) > 0) {
                                // Use year inferred from prerequisite edges
                                year = inferredYears.get(moduleId);
                            } else {
                                year = Math.floor(index / modulesPerYear) + 1;
                                year = Math.min(year, 3);
                            }
                            
                            return {
                                id: moduleNode.id,
                                label: moduleNode.title,
                                year: year,
                                order: moduleNode.order || index
                            };
                        });

                        moduleTopicMap = new Map();
                        modulesById = new Map();
                        modulesForDisplay.forEach((moduleNode) => {
                            const moduleId = String(moduleNode.id);
                            modulesById.set(moduleId, { ...moduleNode, id: moduleId });
                            if (moduleNode.topics && moduleNode.topics.length > 0) {
                                moduleTopicMap.set(moduleId, moduleNode.topics[0].id);
                            }
                        });

                        const moduleIdSet = new Set(nodesData.map(n => String(n.id)));
                        // Also build a set of topic IDs to explicitly exclude edges involving topics
                        const topicIdSet = new Set(topicNodes.map(n => String(n.id)));
                        
                        const isValidDependencyEdge = (edge) => {
                            // Skip 'contains' edges — those are module→topic parent-child relationships
                            if (edge.edge_type === 'contains') return false;
                            // Skip edges where source or target is a topic node
                            if (topicIdSet.has(String(edge.source)) || topicIdSet.has(String(edge.target))) return false;
                            // Only include edges with a meaningful weight/score if available
                            if (edge.weight !== undefined && edge.weight < 0.5) return false;
                            if (edge.score !== undefined && edge.score < 0.5) return false;
                            return true;
                        };
                        
                        let edgesData = (graphData.edges || [])
                            .filter(isValidDependencyEdge)
                            .map(edge => ({ from: String(edge.source), to: String(edge.target) }))
                            .filter(edge => moduleIdSet.has(edge.from) && moduleIdSet.has(edge.to));

                        if (edgesData.length === 0 && fullRoadmap && Array.isArray(fullRoadmap.edges)) {
                            edgesData = fullRoadmap.edges
                                .filter(isValidDependencyEdge)
                                .map(edge => ({ from: String(edge.source), to: String(edge.target) }))
                                .filter(edge => moduleIdSet.has(edge.from) && moduleIdSet.has(edge.to));
                        }

                        const roadmapTitle = (fullRoadmap && fullRoadmap.title) || graphData.roadmap_title || 'Roadmap';
                        const progressValue = graphData.overall_progress_percent || (fullRoadmap && fullRoadmap.overall_progress_percent) || 0;
                        document.getElementById('input-display').textContent = `Tailored Roadmap for: ${roadmapTitle}`;
                        document.getElementById('university-display').textContent = `📚 Progress: ${progressValue}%`;
                        console.log('=== EDGE DEBUG ===');
                        console.log('graphData.edges raw (' + (graphData.edges || []).length + ' total):', JSON.stringify(graphData.edges));
                        // Show edge_type breakdown
                        const edgesByType = {};
                        (graphData.edges || []).forEach(e => {
                            const t = e.edge_type || 'unknown';
                            if (!edgesByType[t]) edgesByType[t] = [];
                            edgesByType[t].push({ source: e.source, target: e.target });
                        });
                        console.log('Edge types breakdown:', Object.keys(edgesByType).map(t => t + ': ' + edgesByType[t].length).join(', '));
                        console.log('Edges by type detail:', JSON.stringify(edgesByType, null, 2));
                        // Find edges involving "Professional Practice"
                        const ppNode = nodesData.find(n => n.label && n.label.toLowerCase().includes('professional practice'));
                        if (ppNode) {
                            const ppId = String(ppNode.id);
                            const ppEdgesAll = (graphData.edges || []).filter(e => String(e.source) === ppId || String(e.target) === ppId);
                            console.log('=== Professional Practice (id=' + ppId + ') ALL raw edges ===', JSON.stringify(ppEdgesAll));
                            const ppEdgesFiltered = edgesData.filter(e => String(e.from) === ppId || String(e.to) === ppId);
                            console.log('=== Professional Practice FILTERED edges (shown in graph) ===', JSON.stringify(ppEdgesFiltered));
                        }
                        console.log('fullRoadmap edges raw:', fullRoadmap && fullRoadmap.edges ? fullRoadmap.edges.length + ' edges' : 'none');
                        console.log('Final edgesData passed to createNetwork (' + edgesData.length + '):', JSON.stringify(edgesData));
                        console.log('nodesData ids:', nodesData.map(n => n.id + ' (' + n.label + ')'));
                        createNetwork(nodesData, edgesData);
                        return;
                    }

                    const response = await ApiService.getRoadmap(roadmapIdParam);
                    if (!response.ok) {
                        throw new Error(ApiService.getErrorMessage(response));
                    }

                    buildNetworkFromRoadmap(response.data);
                    return;
                }
                
                // Prioritize URL input over saved state
                if (input && input.trim()) {
                    // Create from URL input (new roadmap generation)
                    const moduleNames = input.split(',').map(name => name.trim()).filter(name => name);
            
                    if (moduleNames.length > 0) {
                        console.log('Creating network from input with', moduleNames.length, 'modules');
                        
                        // Distribute modules across 3 years
                        const modulesPerYear = Math.ceil(moduleNames.length / 3);
                        
                        const nodesData = moduleNames.map((name, index) => {
                            const year = Math.min(Math.floor(index / modulesPerYear) + 1, 3);
                            return { 
                                id: String(index + 1), 
                                label: name,
                                year: year,
                                order: index
                            };
                        });

                        // No edges for manual input — only API-provided edges are used
                        const edgesData = [];

                        createNetwork(nodesData, edgesData);
                    } else {
                        console.log('No modules in input, using sample data');
                        createNetwork(sampleNodes, sampleEdges);
                    }
                } else {
                    // No URL input - try to restore saved state
                    const savedState = restoreRoadmapState();
                    if (savedState && savedState.nodes && savedState.nodes.length > 0) {
                        console.log('Creating network from saved state with', savedState.nodes.length, 'nodes');
                        createNetwork(savedState.nodes, savedState.edges);
                    } else {
                        console.log('No input and no saved state, using sample data');
                        createNetwork(sampleNodes, sampleEdges);
                    }
                }
            } catch (error) {
                console.error('Error initializing roadmap:', error);
                console.error('Stack:', error.stack);
                if (roadmapIdParam) {
                    const container = document.getElementById('roadmap');
                    if (container) {
                        container.innerHTML = '<div style="padding: 24px; color: #c33; font-weight: 600; text-align: center;">Failed to load this roadmap. Please refresh and try again.</div>';
                    }
                    return;
                }
                try {
                    console.log('Attempting fallback creation...');
                    createNetwork(sampleNodes, sampleEdges);
                } catch (e2) {
                    console.error('Failed to create network:', e2);
                    // Last resort - create the container manually
                    const container = document.getElementById('roadmap');
                    if (container) {
                        console.log('Creating fallback visualization directly...');
                        createFallbackVisualization(container, sampleNodes, sampleEdges);
                    }
                }
            }
        }
        
        // Initialize on DOMContentLoaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                console.log('[DEBUG] DOMContentLoaded event fired');
                setTimeout(initializeRoadmap, 100);
            });
        } else {
            console.log('[DEBUG] DOM already loaded, initializing...');
            setTimeout(initializeRoadmap, 100);
        }
        
        console.log('[DEBUG] Roadmap script loaded, waiting for initialization...');
    
    // Save roadmap state before leaving page
        window.addEventListener('beforeunload', saveRoadmapState);
        window.addEventListener('pagehide', saveRoadmapState);    </script>
</body>
</html>

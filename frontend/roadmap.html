        // Initialize roadmap when page is fully loaded
        // Initialize roadmap immediately
        async function initializeRoadmap() {
            try {
                console.log('Initializing roadmap at', new Date().toLocaleTimeString());
                console.log('Input:', input);
                console.log('Container exists:', !!document.getElementById('roadmap'));

                if (roadmapIdParam) {
                    if (!ApiService.isAuthenticated()) {
                        alert('Please login to view this roadmap.');
                        window.location.href = 'login.html';
                        return;
                    }

                    const graphResponse = await ApiService.getRoadmapGraph(roadmapIdParam);
                    if (graphResponse.ok && graphResponse.data) {
                        const graphData = graphResponse.data;

                        const extractModulesFromPayload = (payload) => {
                            if (!payload || typeof payload !== 'object') return [];
                            if (Array.isArray(payload.modules)) return payload.modules;
                            if (payload.roadmap && Array.isArray(payload.roadmap.modules)) return payload.roadmap.modules;
                            if (payload.data && Array.isArray(payload.data.modules)) return payload.data.modules;
                            return [];
                        };

                        const moduleNodes = (graphData.nodes || [])
                            .filter(node => node.type === 'module')
                            .sort((a, b) => (a.order || 0) - (b.order || 0));
                        const topicNodes = (graphData.nodes || [])
                            .filter(node => node.type === 'topic');

                        // Fetch full roadmap details and prefer it when it has more modules than graph payload
                        let fullRoadmap = null;
                        const fullRoadmapResponse = await ApiService.getRoadmap(roadmapIdParam);
                        if (fullRoadmapResponse.ok) {
                            fullRoadmap = fullRoadmapResponse.data;
                        }

                        const fullRoadmapModules = extractModulesFromPayload(fullRoadmap);
                        const graphPayloadModules = extractModulesFromPayload(graphData);
                        const roadmapModuleCache = JSON.parse(localStorage.getItem('roadmapModuleCache') || '{}');
                        const cachedModules = Array.isArray(roadmapModuleCache[String(roadmapIdParam)])
                            ? roadmapModuleCache[String(roadmapIdParam)]
                            : [];

                        let modulesForDisplay;
                        if (fullRoadmapModules.length > 0) {
                            modulesForDisplay = fullRoadmapModules
                                .slice()
                                .sort((a, b) => (a.order || 0) - (b.order || 0))
                                .map((module, index) => ({
                                    id: module.id ?? module.module_id ?? `full-${index + 1}`,
                                    title: module.title,
                                    description: module.description || '',
                                    topics: (module.topics || [])
                                        .slice()
                                        .sort((a, b) => (a.order || 0) - (b.order || 0))
                                        .map(topic => ({ id: topic.id, title: topic.title, description: topic.description || '' }))
                                }));
                        } else if (graphPayloadModules.length > 0) {
                            modulesForDisplay = graphPayloadModules
                                .slice()
                                .sort((a, b) => (a.order || 0) - (b.order || 0))
                                .map((module, index) => ({
                                    id: module.id ?? module.module_id ?? `graph-${index + 1}`,
                                    title: module.title,
                                    description: module.description || '',
                                    topics: (module.topics || [])
                                        .slice()
                                        .sort((a, b) => (a.order || 0) - (b.order || 0))
                                        .map(topic => ({ id: topic.id, title: topic.title, description: topic.description || '' }))
                                }));
                        } else {
                            modulesForDisplay = moduleNodes.map(moduleNode => ({
                                id: moduleNode.id,
                                title: moduleNode.title,
                                description: moduleNode.description || '',
                                topics: topicNodes
                                    .filter(topic => topic.parent_module_id === moduleNode.id)
                                    .sort((a, b) => (a.order || 0) - (b.order || 0))
                                    .map(topic => ({ id: topic.id, title: topic.title, description: topic.description || '' }))
                            }));
                        }

                        if (cachedModules.length > 0) {
                            const existingTitles = new Set(
                                modulesForDisplay
                                    .map(module => String(module.title || '').trim().toLowerCase())
                                    .filter(Boolean)
                            );
                            const missingCached = cachedModules
                                .filter(title => title && !existingTitles.has(String(title).trim().toLowerCase()))
                                .map((moduleTitle, index) => ({
                                    id: `cached-${index + 1}`,
                                    title: moduleTitle,
                                    description: '',
                                    topics: []
                                }));
                            modulesForDisplay = modulesForDisplay.concat(missingCached);
                        }

                        const seenModuleIds = new Set();
                        modulesForDisplay = modulesForDisplay
                            .filter(module => module && module.title)
                            .map((module, index) => {
                                let resolvedId = module.id;
                                if (resolvedId === undefined || resolvedId === null || seenModuleIds.has(String(resolvedId))) {
                                    resolvedId = `module-${index + 1}`;
                                }
                                seenModuleIds.add(String(resolvedId));
                                return {
                                    ...module,
                                    id: String(resolvedId)
                                };
                            });

                        // Calculate year distribution
                        const totalModules = modulesForDisplay.length;
                        const modulesPerYear = Math.ceil(totalModules / 3);
                        
                        const nodesData = modulesForDisplay.map((moduleNode, index) => {
                            // Determine year from module data or infer from order
                            let year = 1;
                            if (moduleNode.year !== undefined) {
                                year = moduleNode.year;
                            } else if (moduleNode.level !== undefined) {
                                year = moduleNode.level;
                            } else {
                                year = Math.floor(index / modulesPerYear) + 1;
                                year = Math.min(year, 3);
                            }
                            
                            return {
                                id: moduleNode.id,
                                label: moduleNode.title,
                                year: year,
                                order: moduleNode.order || index
                            };
                        });

                        moduleTopicMap = new Map();
                        modulesById = new Map();
                        modulesForDisplay.forEach((moduleNode) => {
                            const moduleId = String(moduleNode.id);
                            modulesById.set(moduleId, { ...moduleNode, id: moduleId });
                            if (moduleNode.topics && moduleNode.topics.length > 0) {
                                moduleTopicMap.set(moduleId, moduleNode.topics[0].id);
                            }
                        });

                        const moduleIdSet = new Set(nodesData.map(n => String(n.id)));
                        let edgesData = (graphData.edges || [])
                            .map(edge => ({ from: String(edge.source), to: String(edge.target) }))
                            .filter(edge => moduleIdSet.has(edge.from) && moduleIdSet.has(edge.to));

                        if (edgesData.length === 0 && fullRoadmap && Array.isArray(fullRoadmap.edges)) {
                            edgesData = fullRoadmap.edges
                                .map(edge => ({ from: String(edge.source), to: String(edge.target) }))
                                .filter(edge => moduleIdSet.has(edge.from) && moduleIdSet.has(edge.to));
                        }

                        const roadmapTitle = (fullRoadmap && fullRoadmap.title) || graphData.roadmap_title || 'Roadmap';
                        const progressValue = graphData.overall_progress_percent || (fullRoadmap && fullRoadmap.overall_progress_percent) || 0;
                        document.getElementById('input-display').textContent = `Tailored Roadmap for: ${roadmapTitle}`;
                        document.getElementById('university-display').textContent = `📚 Progress: ${progressValue}%`;
                        createNetwork(nodesData, edgesData);
                        return;
                    }

                    const response = await ApiService.getRoadmap(roadmapIdParam);
                    if (!response.ok) {
                        throw new Error(ApiService.getErrorMessage(response));
                    }

                    buildNetworkFromRoadmap(response.data);
                    return;
                }
                
                // Prioritize URL input over saved state
                if (input && input.trim()) {
                    // Create from URL input (new roadmap generation)
                    const moduleNames = input.split(',').map(name => name.trim()).filter(name => name);
            
                    if (moduleNames.length > 0) {
                        console.log('Creating network from input with', moduleNames.length, 'modules');
                        
                        // Distribute modules across 3 years
                        const modulesPerYear = Math.ceil(moduleNames.length / 3);
                        
                        const nodesData = moduleNames.map((name, index) => {
                            const year = Math.min(Math.floor(index / modulesPerYear) + 1, 3);
                            return { 
                                id: String(index + 1), 
                                label: name,
                                year: year,
                                order: index
                            };
                        });

                        // Create edges only between sequential modules (basic chain)
                        // Real edges will come from the relationship matrix when loaded from API
                        const edgesData = [];
                        for (let i = 0; i < nodesData.length - 1; i++) {
                            edgesData.push({ 
                                from: nodesData[i].id, 
                                to: nodesData[i+1].id
                            });
                        }

                        createNetwork(nodesData, edgesData);
                    } else {
                        console.log('No modules in input, using sample data');
                        createNetwork(sampleNodes, sampleEdges);
                    }
                } else {
                    // No URL input - try to restore saved state
                    const savedState = restoreRoadmapState();
                    if (savedState && savedState.nodes && savedState.nodes.length > 0) {
                        console.log('Creating network from saved state with', savedState.nodes.length, 'nodes');
                        createNetwork(savedState.nodes, savedState.edges);
                    } else {
                        console.log('No input and no saved state, using sample data');
                        createNetwork(sampleNodes, sampleEdges);
                    }
                }
            } catch (error) {
                console.error('Error initializing roadmap:', error);
                console.error('Stack:', error.stack);
                if (roadmapIdParam) {
                    const container = document.getElementById('roadmap');
                    if (container) {
                        container.innerHTML = '<div style="padding: 24px; color: #c33; font-weight: 600; text-align: center;">Failed to load this roadmap. Please refresh and try again.</div>';
                    }
                    return;
                }
                try {
                    console.log('Attempting fallback creation...');
                    createNetwork(sampleNodes, sampleEdges);
                } catch (e2) {
                    console.error('Failed to create network:', e2);
                    // Last resort - create the container manually
                    const container = document.getElementById('roadmap');
                    if (container) {
                        console.log('Creating fallback visualization directly...');
                        createFallbackVisualization(container, sampleNodes, sampleEdges);
                    }
                }
            }
        }
        
        // Initialize on DOMContentLoaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                console.log('[DEBUG] DOMContentLoaded event fired');
                setTimeout(initializeRoadmap, 100);
            });
        } else {
            console.log('[DEBUG] DOM already loaded, initializing...');
            setTimeout(initializeRoadmap, 100);
        }
        
        console.log('[DEBUG] Roadmap script loaded, waiting for initialization...');
    
    // Save roadmap state before leaving page
        window.addEventListener('beforeunload', saveRoadmapState);
        window.addEventListener('pagehide', saveRoadmapState);    </script>

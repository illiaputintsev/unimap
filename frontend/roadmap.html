<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Roadmap</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-y: auto;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 10px,
                    rgba(255,255,255,.05) 10px,
                    rgba(255,255,255,.05) 20px
                );
            pointer-events: none;
            z-index: 0;
        }
        h1 {
            text-align: center;
            color: #1abc9c;
            margin: 20px 0 10px;
            font-size: 36px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }
        p {
            text-align: center;
            margin: 5px 0;
            position: relative;
            z-index: 1;
        }
        #roadmap {
            width: 95%;
            max-width: 1400px;
            margin: 20px auto;
            height: 800px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 50px;
            position: relative;
            z-index: 1;
            border: 3px solid #e0e0e0;
        }
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            background-color: white;
            padding: 30px;
            border: 3px solid #1abc9c;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(220, 53, 69, 0.3);
            z-index: 2000;
            max-width: 400px;
            max-height: 85vh;
            overflow: auto;
            width: 350px;
        }
        .modal h2 {
            margin-top: 0;
            color: #1abc9c;
            border-bottom: 2px solid #1abc9c;
            padding-bottom: 10px;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 28px;
            color: #1abc9c;
            font-weight: bold;
            transition: color 0.3s;
        }
        .modal-close:hover {
            color: #16a085;
        }
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .modal {
                top: 50%;
                right: 10px;
                transform: translateY(-50%);
                width: calc(100vw - 20px);
                max-width: none;
                max-height: 70vh;
            }
        }
        #logo {
            width: 200px;      
            height: auto;     
            transition: 0.3s; 
        }
        #logo:hover {
            width: 300px;
        }
        /* Menu button */
        #menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3);
            transition: all 0.3s;
        }
        #menu-btn:hover {
            background: linear-gradient(135deg, #16a085 0%, #a01810 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(220, 53, 69, 0.4);
        }
        #menu-btn span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 3px 0;
            border-radius: 2px;
        }
        /* Menu dropdown */
        #menu-dropdown {
            display: none;
            position: fixed;
            top: 65px;
            left: 15px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            min-width: 250px;
            max-height: 400px;
            overflow-y: auto;
        }
        #menu-dropdown a, #menu-dropdown .menu-section {
            display: block;
            padding: 12px 20px;
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }
        #menu-dropdown a:hover {
            background-color: #fff5f5;
            color: #1abc9c;
        }
        .menu-section {
            background-color: #f9f9f9;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            cursor: default;
        }
        .menu-section:hover {
            background-color: #f9f9f9;
            color: #666;
        }
        #module-input-container {
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        #module-input-container input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
            margin-bottom: 8px;
        }
        #module-input-container button {
            width: 100%;
            padding: 8px;
            background-color: #1abc9c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        #module-input-container button:hover {
            background-color: #16a085;
        }
        /* User info */
        #user-info {
            position: fixed;
            top: 70px;
            left: 15px;
            background: linear-gradient(135deg, white 0%, #fff5f5 100%);
            padding: 10px 18px;
            border-radius: 20px;
            box-shadow: 0 3px 10px rgba(220, 53, 69, 0.2);
            font-size: 13px;
            color: #1abc9c;
            z-index: 999;
            border: 2px solid #ffc7ce;
            font-weight: 600;
        }
        .course-info {
            text-align: center;
            font-size: 15px;
            color: #555;
            margin: 8px 0;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }
        /* Canvas node fade-in animation */
        #roadmap {
            animation: containerFadeIn 0.5s ease-in;
        }
        @keyframes containerFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Menu Button -->
    <button id="menu-btn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>
    
    <!-- Menu Dropdown -->
    <div id="menu-dropdown">
        <div class="menu-section">📚 Manage Modules</div>
        <div id="module-input-container">
            <input 
                type="text" 
                id="new-module-input" 
                placeholder="Add new module..." 
                onkeypress="if(event.key==='Enter') addModuleToRoadmap()"
            >
            <button onclick="addModuleToRoadmap()">Add Module</button>
        </div>
        
        <div class="menu-section">⚙️ Navigation</div>        <a href="#" id="my-roads-btn" style="display: none;" onclick="openMyRoadmaps(); return false;">🗺️ My Roadmaps</a>        <a href="progress.html">📊 Your Progress</a>
        <a href="index.html">🏠 Home</a>
        <a href="login.html">🔑 Login</a>
        <a href="signup.html">📝 Sign Up</a>
        <a href="#" onclick="logout(); return false;">🚪 Logout</a>
    </div>

    <!-- User Info -->
    <div id="user-info">
        <span id="username">Guest</span>
        <a href="profile.html" style="margin-left: 15px; padding: 8px 15px; background-color: #1abc9c; color: white; text-decoration: none; border-radius: 5px; font-weight: 600; transition: all 0.3s;" onmouseover="this.style.backgroundColor='#16a085'" onmouseout="this.style.backgroundColor='#1abc9c'">⚙️ Profile</a>
    </div>

    <h1>Student Roadmap</h1>
    <p class="course-info" id="university-display"></p>
    <p id="input-display"></p>
    <img id="logo" src="assets\Gemini_Generated_Image_9eplpw9eplpw9epl__1_-removebg-preview.png" alt="Logo" style="position: fixed; top: 5px; right: 5px; cursor: default; z-index: 10;">
    <div id="roadmap"></div>

    <div id="node-modal" class="modal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <h2 id="modal-title"></h2>
        <p id="modal-content"></p>
        <button id="quiz-button" style="margin-top: 15px; padding: 10px 20px; background-color: #1abc9c; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600;" onclick="openQuiz()">📝 Take Quiz</button>
        <p id="quiz-score" style="margin-top: 10px; font-size: 14px; color: #666; display: none;"></p>
    </div>

    <script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
    <script>
        // Get input from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const input = urlParams.get('input');
        const courseName = urlParams.get('course');
        const universityName = urlParams.get('university');
        
        // Display course and university info
        const firstNode = input ? input.split(',')[0].trim() : null;
        document.getElementById('input-display').textContent = firstNode ? `Tailored Roadmap for: ${courseName || firstNode}` : 'Sample roadmap (no input provided)';
        
        if (universityName) {
            const universityDisplayMap = {
                'ucl': 'University College London',
                'imperial': 'Imperial College London',
                'oxford': 'University of Oxford',
                'cambridge': 'University of Cambridge',
                'edinburgh': 'University of Edinburgh',
                'manchester': 'University of Manchester',
                'kcl': "King's College London"
            };
            document.getElementById('university-display').textContent = `📚 ${universityDisplayMap[universityName] || universityName}`;
        }
        
        // Check login status
        function checkLoginStatus() {
            const user = localStorage.getItem('currentUser');
            if (user) {
                const userData = JSON.parse(user);
                document.getElementById('username').textContent = userData.name || userData.email;
                // Show My Roadmaps button for logged-in users
                const myRoadsBtn = document.getElementById('my-roads-btn');
                if (myRoadsBtn) myRoadsBtn.style.display = 'block';
            } else {
                document.getElementById('username').textContent = 'Guest';
            }
        }
        
        // Save roadmap state to localStorage
        function saveRoadmapState() {
            if (!window.network || !window.nodes) return;
            
            const state = {
                nodes: window.nodes.get(),
                edges: window.edges.get(),
                viewportState: {
                    scale: window.network.getScale(),
                    position: window.network.getViewPosition()
                },
                inputModules: document.getElementById('input-display')?.textContent || ''
            };
            
            localStorage.setItem('roadmapState', JSON.stringify(state));
        }
        
        // Restore roadmap state from localStorage
        function restoreRoadmapState() {
            const savedState = localStorage.getItem('roadmapState');
            if (savedState) {
                try {
                    const state = JSON.parse(savedState);
                    // State will be restored after network initialization
                    return state;
                } catch (e) {
                    console.error('Error restoring roadmap state:', e);
                }
            }
            return null;
        }
        
        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('currentUser');
                // Hide My Roadmaps button
                const myRoadsBtn = document.getElementById('my-roads-btn');
                if (myRoadsBtn) myRoadsBtn.style.display = 'none';
                alert('Logged out successfully!');
                checkLoginStatus();
            }
        }
        
        // Open My Roadmaps modal
        function openMyRoadmaps() {
            const user = localStorage.getItem('currentUser');
            if (!user) {
                alert('Please login to view your roadmaps');
                return;
            }
            
            // Fetch user roadmaps from localStorage (or backend when available)
            const userRoadmaps = JSON.parse(localStorage.getItem('userRoadmaps')) || [];
            
            let html = '<h2>🗺️ My Roadmaps</h2>';
            
            if (userRoadmaps.length === 0) {
                html += '<p style="color: #666; text-align: center; padding: 20px;">No saved roadmaps yet. Create one and save it!</p>';
            } else {
                html += '<div style="display: flex; flex-direction: column; gap: 10px;">';
                userRoadmaps.forEach((roadmap, index) => {
                    html += `
                        <div style="padding: 12px; background-color: #f5f5f5; border-radius: 8px; cursor: pointer; border-left: 4px solid #1abc9c;" onmouseover="this.style.backgroundColor='#efefef'" onmouseout="this.style.backgroundColor='#f5f5f5'" onclick="loadRoadmapSnapshot(${index})">
                            <strong>${roadmap.name || 'Unnamed Roadmap'}</strong><br>
                            <small style="color: #999;">${roadmap.createdAt || 'No date'}</small>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            // Show in modal
            const modal = document.querySelector('.modal');
            if (modal) {
                modal.innerHTML = html + '<button onclick="closeModal()" style="width: 100%; margin-top: 15px; padding: 10px; background: #1abc9c; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Close</button>';
                modal.style.display = 'block';
            }
        }
        
        // Load a saved roadmap snapshot
        function loadRoadmapSnapshot(index) {
            const userRoadmaps = JSON.parse(localStorage.getItem('userRoadmaps')) || [];
            if (userRoadmaps[index]) {
                const roadmap = userRoadmaps[index];
                localStorage.setItem('roadmapState', JSON.stringify(roadmap.state));
                location.reload();
            }
        }
        
        // Initialize login status
        checkLoginStatus();
        
        // Draggable logo
        const logo = document.getElementById('logo');
        let isDragging = false;
        let offsetX, offsetY;

        // Sample data for the roadmap
        const sampleNodes = [
            { id: 1, label: 'Introduction to Programming' },
            { id: 2, label: 'Variables and Data Types' },
            { id: 3, label: 'Control Structures' },
            { id: 4, label: 'Functions' },
            { id: 5, label: 'Object-Oriented Programming' },
            { id: 6, label: 'Data Structures' },
            { id: 7, label: 'Algorithms' }
        ];
        const sampleEdges = [
            { from: 1, to: 2 },
            { from: 2, to: 3 },
            { from: 3, to: 4 },
            { from: 4, to: 5 },
            { from: 5, to: 6 },
            { from: 6, to: 7 }
        ];

        // Function to create the network
        function createNetwork(nodesData, edgesData) {
            const container = document.getElementById('roadmap');
            const data = { 
                nodes: new vis.DataSet(nodesData), 
                edges: new vis.DataSet(edgesData) 
            };

            // Store globally for later access
            window.nodes = data.nodes;
            window.edges = data.edges;
            window.nodesData = nodesData;

            const options = {
                autoResize: true,
                layout: {
                    hierarchical: {
                        direction: 'UD',
                        sortMethod: 'directed',
                        nodeSpacing: 150,
                        levelSeparation: 100 // Controls vertical gap between nodes
                    }
                },
                physics: false,
                interaction: {
                    dragNodes: false,
                    dragView: false,
                    zoomView: false // Disable zoom to allow page scroll with mouse wheel
                },
                nodes: {
                    color: {
                        background: '#1abc9c',
                        border: '#1abc9c',
                        highlight: {
                            background: '#16a085',
                            border: '#a01611'
                        },
                        hover: {
                            background: '#e85d5e',
                            border: '#1abc9c'
                        }
                    },
                    shape: 'box',
                    margin: 12,
                    font: { 
                        size: 16, 
                        color: 'white',
                        face: 'Segoe UI',
                        bold: {
                            color: 'white'
                        }
                    },
                    borderWidth: 3,
                    borderWidthSelected: 4,
                    shadow: {
                        enabled: true,
                        color: 'rgba(220, 53, 69, 0.3)',
                        size: 10,
                        x: 3,
                        y: 3
                    },
                    shapeProperties: {
                        borderRadius: 8
                    }
                },
                edges: {
                    arrows: { to: { enabled: false } },
                    color: {
                        color: '#6c757d',
                        highlight: '#16a085',
                        hover: '#e85d5e'
                    },
                    width: 3,
                    smooth: {
                        type: 'cubicBezier',
                        forceDirection: 'vertical',
                        roundness: 0.4
                    },
                    shadow: {
                        enabled: true,
                        color: 'rgba(0,0,0,0.1)',
                        size: 5,
                        x: 2,
                        y: 2
                    }
                }
            };

            const network = new vis.Network(container, data, options);
            
            // Store network globally for later access
            window.network = network;

            // Prevent canvas from capturing scroll wheel - allow page scroll
            container.addEventListener('wheel', (e) => {
                // Let the event bubble up to allow page scrolling
                return true;
            }, { passive: true });

            // Calculate and set container height based on number of nodes
            const nodeCount = nodesData.length;
            const levelSeparation = 100;
            const estimatedHeight = Math.max(800, (nodeCount * levelSeparation) + 400);
            container.style.height = estimatedHeight + 'px';

            // Show all nodes and edges immediately (no animation lag)
            // This ensures fast loading without the domino effect delay

            // Show all nodes and position properly
            network.once('stabilized', function() {
                // Fit all nodes in view
                network.fit({ animation: true, animationOptions: { duration: 800, easingFunction: 'easeInOutQuad' } });
                // Scroll page to top
                window.scrollTo(0, 0);
            });

            // POPUP LOGIC: Re-adding the click event
            network.on('click', function(params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const node = window.nodesData.find(n => n.id === nodeId);
                    if (node) {
                        // Store current node ID for quiz button
                        window.currentNodeId = nodeId;
                        
                        document.getElementById('modal-title').textContent = node.label;
                        document.getElementById('modal-content').textContent = `Step ${node.id}: Detailed resources for learning ${node.label} will appear here`;
                        
                        // Check if quiz has been completed for this module
                        const quizResultsKey = `quiz-${nodeId}`;
                        const quizResults = JSON.parse(localStorage.getItem(quizResultsKey));
                        
                        if (quizResults) {
                            // Show quiz score
                            document.getElementById('quiz-score').textContent = `Your Quiz Score: ${quizResults.score}%`;
                            document.getElementById('quiz-score').style.display = 'block';
                        } else {
                            document.getElementById('quiz-score').style.display = 'none';
                        }
                        
                        document.getElementById('node-modal').style.display = 'block';
                    }
                }
            });
        }

        function closeModal() {
            document.getElementById('node-modal').style.display = 'none';
        }

        function openQuiz() {
            const nodeId = window.currentNodeId;
            if (!nodeId || !window.nodesData) {
                alert('Error: Could not load quiz. Please try again.');
                return;
            }
            
            const node = window.nodesData.find(n => n.id === nodeId);
            if (node) {
                // Open quiz page with topic name and module ID
                window.location.href = `quiz.html?moduleId=${nodeId}&topic=${encodeURIComponent(node.label)}`;
            } else {
                alert('Error: Module not found');
            }
        }

        function toggleMenu() {
            const menu = document.getElementById('menu-dropdown');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        // Add new module to the roadmap
        function addModuleToRoadmap() {
            const input = document.getElementById('new-module-input');
            const moduleName = input.value.trim();
            
            if (!moduleName) {
                alert('Please enter a module name');
                return;
            }
            
            // Get the highest existing node ID
            const nodeIds = nodes.get().map(n => n.id);
            const maxId = nodeIds.length > 0 ? Math.max(...nodeIds) : 0;
            const newId = maxId + 1;
            
            // Add new node to the network
            const newNode = {
                id: newId,
                label: moduleName
            };
            nodes.add([newNode]);
            
            // Connect the new module to the last module in the sequence
            if (nodeIds.length > 0) {
                const lastNodeId = nodeIds[nodeIds.length - 1];
                edges.add([{
                    from: lastNodeId,
                    to: newId
                }]);
            }
            
            // Clear input field
            input.value = '';
            
            // Trigger network animation to fit the new node
            network.fit({
                animation: {
                    duration: 400,
                    easingFunction: 'easeInOutQuad'
                }
            });
            
            // Close menu
            document.getElementById('menu-dropdown').style.display = 'none';
        }

        // Close menu when clicking outside
        window.addEventListener('click', function(e) {
            const menu = document.getElementById('menu-dropdown');
            const menuBtn = document.getElementById('menu-btn');
            if (!menuBtn.contains(e.target) && !menu.contains(e.target)) {
                menu.style.display = 'none';
            }
        });

        // Try to restore saved state first
        const savedState = restoreRoadmapState();
        
        if (savedState && savedState.nodes && savedState.nodes.length > 0) {
            // Restore from saved state
            createNetwork(savedState.nodes, savedState.edges);
            
            // Restore viewport position after network is created
            setTimeout(() => {
                if (window.network && savedState.viewportState) {
                    window.network.moveTo({
                        scale: savedState.viewportState.scale,
                        position: savedState.viewportState.position
                    });
                }
            }, 200);
        } else if (input) {
            // Create from input if no saved state exists
            const moduleNames = input.split(',').map(name => name.trim()).filter(name => name);
    
            // Create Nodes
            const nodesData = moduleNames.map((name, index) => ({ 
                id: index + 1, 
                label: name
            }));

            // Create edges
            const edgesData = [];
            for (let i = 0; i < nodesData.length - 1; i++) {
                edgesData.push({ 
                    from: nodesData[i].id, 
                    to: nodesData[i+1].id
                });
            }

            createNetwork(nodesData, edgesData);
        }
    
    // Save roadmap state before leaving page
        window.addEventListener('beforeunload', saveRoadmapState);
        window.addEventListener('pagehide', saveRoadmapState);    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - Student Roadmap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .back-button {
            position: fixed;
            top: 15px;
            left: 15px;
            padding: 10px 20px;
            background-color: white;
            border: 2px solid #d63031;
            color: #d63031;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            z-index: 100;
            transition: all 0.3s;
        }
        .back-button:hover {
            background-color: #d63031;
            color: white;
        }
        .profile-container {
            max-width: 600px;
            margin: 80px auto 40px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
        }
        .profile-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .profile-header h1 {
            color: #d63031;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .profile-picture-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #f0f0f0;
            border: 4px solid #d63031;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin: 0 auto 15px;
            overflow: hidden;
            object-fit: cover;
        }
        .picture-upload {
            display: none;
        }
        .upload-button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #d63031 0%, #b81d13 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .upload-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(214, 48, 49, 0.4);
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Segoe UI', sans-serif;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #d63031;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .save-button {
            background: linear-gradient(135deg, #d63031 0%, #b81d13 100%);
            color: white;
        }
        .save-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(214, 48, 49, 0.4);
        }
        .cancel-button {
            background-color: #f0f0f0;
            color: #333;
        }
        .cancel-button:hover {
            background-color: #e0e0e0;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }
        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease-in;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .avatar-emoji {
            display: inline-block;
            font-size: 60px;
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="goBack()">← Back</button>

    <div class="profile-container">
        <div class="profile-header">
            <h1>⚙️ Profile Settings</h1>
        </div>

        <div class="success-message" id="success-message">✓ Profile updated successfully!</div>

        <form id="profile-form">
            <div class="profile-picture-section">
                <div class="profile-picture" id="profile-picture">👤</div>
                <input type="file" id="picture-upload" class="picture-upload" accept="image/*" onchange="handlePictureUpload(event)">
                <button type="button" class="upload-button" onclick="document.getElementById('picture-upload').click()">Change Picture</button>
            </div>

            <div class="form-group">
                <label for="nickname">Nickname</label>
                <input type="text" id="nickname" name="nickname" placeholder="Enter your nickname" required>
            </div>

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="university">University</label>
                <input type="text" id="university" name="university" placeholder="Your university">
            </div>

            <div class="form-group">
                <label for="course">Course/Program</label>
                <input type="text" id="course" name="course" placeholder="Your course of study">
            </div>

            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" placeholder="Tell us about yourself..."></textarea>
            </div>

            <div class="button-group">
                <button type="button" class="cancel-button" onclick="goBack()">Cancel</button>
                <button type="submit" class="save-button">Save Changes</button>
            </div>
        </form>
    </div>

    <script>
        // Load profile data on page load
        function loadProfile() {
            const profileData = JSON.parse(localStorage.getItem('userProfile')) || {};
            
            if (profileData.nickname) {
                document.getElementById('nickname').value = profileData.nickname;
            }
            if (profileData.fullname) {
                document.getElementById('fullname').value = profileData.fullname;
            }
            if (profileData.email) {
                document.getElementById('email').value = profileData.email;
            }
            if (profileData.university) {
                document.getElementById('university').value = profileData.university;
            }
            if (profileData.course) {
                document.getElementById('course').value = profileData.course;
            }
            if (profileData.bio) {
                document.getElementById('bio').value = profileData.bio;
            }
            if (profileData.profilePicture) {
                document.getElementById('profile-picture').innerHTML = `<img src="${profileData.profilePicture}" alt="Profile" style="width: 100%; height: 100%; object-fit: cover;">`;
            }
        }

        // Handle form submission
        document.getElementById('profile-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const profileData = {
                nickname: document.getElementById('nickname').value,
                fullname: document.getElementById('fullname').value,
                email: document.getElementById('email').value,
                university: document.getElementById('university').value,
                course: document.getElementById('course').value,
                bio: document.getElementById('bio').value,
                profilePicture: localStorage.getItem('profilePictureData') || profileData.profilePicture
            };
            
            // Save to localStorage
            localStorage.setItem('userProfile', JSON.stringify(profileData));
            
            // Update user info in currentUser
            const user = JSON.parse(localStorage.getItem('currentUser')) || {};
            user.name = profileData.nickname;
            localStorage.setItem('currentUser', JSON.stringify(user));
            
            // Show success message
            const successMsg = document.getElementById('success-message');
            successMsg.classList.add('show');
            
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 3000);
        });

        // Handle picture upload
        function handlePictureUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageData = e.target.result;
                    document.getElementById('profile-picture').innerHTML = `<img src="${imageData}" alt="Profile" style="width: 100%; height: 100%; object-fit: cover;">`;
                    localStorage.setItem('profilePictureData', imageData);
                };
                reader.readAsDataURL(file);
            }
        }

        function goBack() {
            window.history.back();
        }

        // Initialize
        window.addEventListener('load', loadProfile);
    </script>
</body>
</html>
